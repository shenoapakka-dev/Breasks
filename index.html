  return ''+
  '<div class="card" style="padding-bottom:10px">'+
    '<div class="btnrow" style="justify-content:space-between;margin-bottom:12px">'+
      '<div><h2 style="margin:0">Dashboard</h2><p class="sub" style="margin:2px 0 0">Analytics across every submitted request (refreshes automatically).</p></div>'+
      '<div class="btnrow" style="gap:16px">'+
        '<div class="scopebar">'+
          ["today","month","all","custom"].map(function(s){ return '<button data-scope="'+s+'" class="'+(scope===s?"active":"")+'">'+({today:"Today",month:"This Month",all:"All Time",custom:"Custom"}[s])+'</button>'; }).join("")+
        '</div>'+
        '<div class="btnrow" style="gap:8px">'+
          '<button class="btn sm" id="exportXlsxBtn" title="Every request, every breakdown table — full workbook">📊 Export Excel</button>'+
          '<button class="btn sm" id="exportPptxBtn" title="The charts on this page, as a slide deck">📑 Export PowerPoint</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (scope==="custom" ? (
      '<div class="btnrow" style="margin-bottom:4px">'+
        '<div class="field" style="width:160px"><label>From</label><input type="date" id="dashFrom" value="'+esc(state.dashRange.from)+'"></div>'+
        '<div class="field" style="width:160px"><label>To</label><input type="date" id="dashTo" value="'+esc(state.dashRange.to)+'"></div>'+
      '</div>'
    ) : '')+
    '<div class="btnrow">'+
      '<div class="field" style="width:150px"><label>Region</label><select id="dfRegion"><option value="">All</option>'+
        REGIONS.map(function(r){ return '<option value="'+r.code+'" '+(f.region===r.code?"selected":"")+'>'+r.code+'</option>'; }).join("")+'</select></div>'+
      '<div class="field" style="width:190px"><label>Status</label><select id="dfStatus"><option value="">All</option>'+
        Object.keys(STATUS).filter(function(k){return k!=="pending";}).map(function(k){ return '<option value="'+k+'" '+(f.status===k?"selected":"")+'>'+STATUS[k].label+'</option>'; }).join("")+'</select></div>'+
      '<div class="field" style="width:140px"><label>Order Type</label><select id="dfOrderType"><option value="">All</option><option '+(f.orderType==="Store"?"selected":"")+'>Store</option><option '+(f.orderType==="Online"?"selected":"")+'>Online</option></select></div>'+
      '<div class="field" style="width:150px"><label>Source</label><select id="dfSource"><option value="">All</option>'+
        SOURCES.map(function(s){ return '<option value="'+esc(s)+'" '+(f.source===s?"selected":"")+'>'+esc(s)+'</option>'; }).join("")+'</select></div>'+
      '<div class="field" style="width:150px"><label>Agent</label><select id="dfAgent"><option value="">All</option>'+
        agentNames().map(function(a){ return '<option value="'+esc(a)+'" '+(f.agent===a?"selected":"")+'>'+esc(a)+'</option>'; }).join("")+'</select></div>'+
    '</div>'+
  '</div>'+
  '<div class="kpis">'+
    kpi("Requests", total, scopeLabel(scope))+
    kpi("Cancelled Value", "AED "+fmtMoney(cancelledAmt), closedList.length+" closed request(s), converted to AED")+
    kpi("Pending Value", "AED "+fmtMoney(pendingAmt), openList.length+" still open, converted to AED")+
    kpi("Retention Rate", retRate+"%", retained+" of "+total+" retained")+
    kpi("Closed Rate", closedRate+"%", closedList.length+" of "+total+" fully cancelled")+
  '</div>'+
  '<div class="card"><h2>Requests Over Time</h2><p class="sub">'+(scope==="today"?"Hourly for today":(scope==="month"?"Daily for this month":(scope==="custom"?"Across the selected range":"Monthly, last 12 months")))+' — stacked by region; hover a bar for the exact split.</p>'+
    renderTrendSVG(trendBuckets)+
    renderRegionLegend(list)+
  '</div>'+
  '<div class="chartgrid">'+
    chartCard("Order Type", donutSVG(toPairs(byType),{"Store":"cat-1","Online":"cat-2"},"orderType"))+
    chartCard("Source of Request", donutSVG(toPairs(bySource),{"Call Center":"cat-1","Care Email":"cat-5","Store":"cat-2","Unspecified":"cat-6"},"source"))+
  '</div>'+
  '<div class="chartgrid">'+
    chartCard("Refund Method", donutSVG(toPairs(byRefund),{"Same Payment Method":"cat-3","Credit Note":"cat-4","Cash on Delivery - No Refund":"cat-5"}))+
    chartCard("Retain vs Not Retain", donutSVG(toPairs(byRetain),{"Retained":"good","Not Retained":"bad"}))+
  '</div>'+
  chartCard("Request Status", donutSVG(toPairs(byStatus),{"New":"warn","Rejected — Returned to Agent":"bad","Not Cancelled (Technical Issue)":"bad","Approved & Sent to the Store":"good","Sent to the Store":"info","Sent To the Store For Cancellation & Refund":"info","Sent To the Store For Cancellation & Keep Credit Note":"cat-6","Sent to Online Team":"cat-2","Cancelled with Refund Same Payment Method":"cat-4","Cancelled With Credit Note":"cat-3","Cancelled CDF":"cat-5"},"status",statusKeyForLabel))+
  '<div class="card"><h2>Top Cancellation Reasons</h2><p class="sub">Ranked by volume'+(scope!=="all"?" "+scopeLabel(scope):"")+' — click a reason to filter everything below by it.</p>'+ hbarList(byReason,8,null,"reason") +'</div>'+
  '<div class="chartgrid">'+
    chartCard("By Region — count", hbarList(byRegion,6,null,"region",regionCodeForLabel))+
    chartCard("By Region — value (AED)", hbarList(byRegionAmt,6,function(v){return "AED "+fmtMoney(v);},"region",regionCodeForLabel))+

  '<div class="card"><h2 style="font-size:14.5px">By Agent</h2>'+ hbarList(byAgent,8,null,"agent") +'</div>'+

    chartCard("Top Customers — count", hbarList(byCustomerCount,8))+
    chartCard("Top Customers — value (AED)", hbarList(byCustomerAmt,8,function(v){return "AED "+fmtMoney(v);}))+

}
function scopeLabel(s){ return s==="today"?"today":(s==="month"?"this month":(s==="custom"?"the selected range":"all time")); }
function kpi(lbl,val,sub){ return '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val num">'+val+'</div><div class="sub">'+sub+'</div></div>'; }
function chartCard(title,inner){ return '<div class="card"><h2 style="font-size:14.5px">'+title+'</h2>'+inner+'</div>'; }
function toPairs(m){ return Object.keys(m).map(function(k){ return {label:k, value:m[k]}; }).sort(function(a,b){return b.value-a.value;}); }
function regionCodeForLabel(label){ var m = REGIONS.filter(function(r){ return r.label===label; })[0]; return m ? m.code : ""; }
function statusKeyForLabel(label){
  var keys = Object.keys(STATUS);
  for(var i=0;i<keys.length;i++){ if(keys[i]!=="pending" && STATUS[keys[i]].label===label) return keys[i]; }
  return "";
}

// filterKey/toValue (optional) make each row clickable, applying it as a
// Dashboard filter (toggles off on a second click) — turns a breakdown
// into a drill-down instead of a read-only picture.
function hbarList(m, limit, fmt, filterKey, toValue){
  var pairs = toPairs(m).slice(0, limit||10);
  if(!pairs.length) return '<p class="sub">No data yet.</p>';
  var max = Math.max.apply(null, pairs.map(function(p){return p.value;}));
  return '<div class="hbarlist">'+ pairs.map(function(p){
    var pct = max? Math.max(4, Math.round(p.value/max*100)) : 0;
    var val = toValue ? toValue(p.label) : p.label;
    var clickable = filterKey && val;
    var active = clickable && state.dashFilters[filterKey]===val;
    var attrs = clickable ? ' data-chart-filter="'+esc(filterKey)+'" data-chart-value="'+esc(val)+'" style="cursor:pointer"' : '';
    return '<div class="hbarrow'+(active?" active":"")+'"'+attrs+'><div class="lbl" title="'+esc(p.label)+'">'+esc(p.label)+'</div>'+
      '<div class="hbartrack"><div class="hbarfill" style="width:'+pct+'%"></div></div>'+
      '<div class="v num">'+(fmt?fmt(p.value):p.value)+'</div></div>';
  }).join("") +'</div>';
}

var FALLBACK_CATS = ["cat-1","cat-2","cat-3","cat-4","cat-5","cat-6"];
function colorForLabel(label, colorMap, fallbackIndex){
  if(colorMap && colorMap[label]) return "var(--"+colorMap[label]+")";
  return "var(--"+FALLBACK_CATS[fallbackIndex%FALLBACK_CATS.length]+")";
}
function donutSVG(pairs, colorMap, filterKey, toValue){
  if(!pairs.length) return '<p class="sub">No data yet.</p>';
  var total = pairs.reduce(function(s,p){return s+p.value;},0);
  if(!total) return '<p class="sub">No data yet.</p>';
  var R=58, C=2*Math.PI*R, gap=3, circ="";
  var offset=0;
  pairs.forEach(function(p,i){
    var color = colorForLabel(p.label, colorMap, i);
    var frac = p.value/total;
    var len = Math.max(0, frac*C - gap);
    circ += '<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 90 90)"></circle>';
    offset += frac*C;
  });
  var legend = pairs.map(function(p,i){
    var color = colorForLabel(p.label, colorMap, i);
    var pct = Math.round(p.value/total*100);
    var val = toValue ? toValue(p.label) : p.label;
    var clickable = filterKey && val;
    var active = clickable && state.dashFilters[filterKey]===val;
    var attrs = clickable ? ' data-chart-filter="'+esc(filterKey)+'" data-chart-value="'+esc(val)+'" style="cursor:pointer"' : '';
    return '<div class="item'+(active?" active":"")+'"'+attrs+'><span class="sw" style="background:'+color+'"></span>'+esc(p.label)+' <b>'+p.value+'</b> ('+pct+'%)</div>';
  }).join("");
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
    '<svg width="140" height="140" viewBox="0 0 180 180"><g>'+circ+'</g>'+
    '<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Manrope,sans-serif">'+total+'</text>'+
    '<text x="90" y="104" text-anchor="middle" font-size="11" fill="var(--ink-faint)">total</text>'+
    '</svg><div class="legend" style="margin-top:0;flex-direction:column;gap:7px">'+legend+'</div></div>';
}

var REGION_COLORS = {UAE:"cat-1", KSA:"cat-2", QAT:"cat-3", OMN:"cat-4"};
function emptyRegionMap(){ var o={}; REGIONS.forEach(function(r){ o[r.code]=0; }); return o; }
function buildTrend(list, scope){
  var buckets = [];
  function bump(bucket, r){
    bucket.value++;
    if(bucket.byRegion[r.region]!=null){ bucket.byRegion[r.region]++; bucket.byRegionAmt[r.region]+=toAED(r.amount, r.region); }
  }
  if(scope==="today"){
    for(var h=0;h<24;h++){ buckets.push({label:(h%6===0?pad2(h)+":00":""), key:h, value:0, byRegion:emptyRegionMap(), byRegionAmt:emptyRegionMap()}); }
    list.forEach(function(r){ bump(buckets[new Date(r.createdAt).getHours()], r); });
  } else if(scope==="month"){
    var days = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    for(var d=1; d<=days; d++){ buckets.push({label:(d%5===0||d===1?String(d):""), key:d, value:0, byRegion:emptyRegionMap(), byRegionAmt:emptyRegionMap()}); }
    list.forEach(function(r){ bump(buckets[new Date(r.createdAt).getDate()-1], r); });
  } else {
    var now=new Date();
    var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    for(var i=11;i>=0;i--){ var dt=new Date(now.getFullYear(), now.getMonth()-i, 1); buckets.push({label:names[dt.getMonth()], key:dt.getFullYear()+"-"+dt.getMonth(), value:0, byRegion:emptyRegionMap(), byRegionAmt:emptyRegionMap()}); }
    var idx={}; buckets.forEach(function(b,i2){ idx[b.key]=i2; });
    list.forEach(function(r){ var dt=new Date(r.createdAt); var k=dt.getFullYear()+"-"+dt.getMonth(); if(idx[k]!=null) bump(buckets[idx[k]], r); });
  }
  return buckets;
}
// Each day/hour/month bar is stacked by region (a real, meaningful color per
// region, reused from the rest of the dashboard) instead of one flat color —
// hovering shows the total plus the per-region split; the legend under the
// chart gives running totals (count + AED value) for the whole period shown.
function renderTrendSVG(buckets){
  if(!buckets.length) return '<p class="sub">No data yet.</p>';
  var max = Math.max(1, Math.max.apply(null, buckets.map(function(b){return b.value;})));
  var W=880, H=200, padL=6, padB=22, padT=18, n=buckets.length;
  var bw = (W-padL*2)/n;
  var chartH = H-padB-padT;
  var bars = buckets.map(function(b,i){
    var x = padL + i*bw, bwReal = Math.max(2, bw-2), cum = 0, cx = x+1+bwReal/2;
    var segs = REGIONS.map(function(rg){
      var v = b.byRegion[rg.code]||0;
      if(!v) return "";
      var h = Math.max(1, Math.round((v/max) * chartH));
      var y = H-padB-cum-h;
      cum += h;
      // The count only fits inside its own slice when that slice is tall
      // enough to hold a readable number — otherwise it's still in the
      // hover tooltip, just not printed on a sliver a few pixels tall.
      var numTxt = (h>=13) ? '<text x="'+cx+'" y="'+(y+h/2+3)+'" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">'+v+'</text>' : "";
      return '<rect x="'+(x+1)+'" y="'+y+'" width="'+bwReal+'" height="'+h+'" fill="var(--'+REGION_COLORS[rg.code]+')" stroke="var(--surface)" stroke-width="1"></rect>'+numTxt;
    }).join("");
    var totalTxt = b.value>0 ? '<text x="'+cx+'" y="'+(H-padB-cum-4)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">'+b.value+'</text>' : "";
    var detail = REGIONS.map(function(rg){ var v=b.byRegion[rg.code]||0; return v ? (rg.code+" "+v) : null; }).filter(Boolean).join(" · ");
    return '<g><rect class="trbar" data-v="'+b.value+'" data-detail="'+esc(detail)+'" x="'+(x+1)+'" y="'+padT+'" width="'+bwReal+'" height="'+chartH+'" fill="transparent"></rect>'+segs+totalTxt+'</g>';
  }).join("");
  var labels = buckets.map(function(b,i){
    if(!b.label) return "";
    var x = padL + i*bw + bw/2;
    return '<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+esc(b.label)+'</text>';
  }).join("");
  return '<svg id="trendSvg" width="100%" viewBox="0 0 '+W+' '+H+'" style="overflow:visible;max-width:100%">'+
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padL)+'" y2="'+(H-padB)+'" stroke="var(--border)" stroke-width="1"></line>'+
    bars+labels+'</svg>';
}
function renderRegionLegend(list){
  var stats = {}; REGIONS.forEach(function(rg){ stats[rg.code] = {count:0, amt:0}; });
  list.forEach(function(r){ if(stats[r.region]){ stats[r.region].count++; stats[r.region].amt += toAED(r.amount, r.region); } });
  return '<div class="regionlegend">'+REGIONS.map(function(rg){
    var s = stats[rg.code];
    return '<div class="regionlegend-item"><span class="dot" style="background:var(--'+REGION_COLORS[rg.code]+')"></span>'+
      '<span class="rl-name">'+esc(rg.label)+'</span>'+
      '<span class="rl-count">'+s.count+' req'+(s.count===1?"":"s")+'</span>'+
      '<span class="rl-amt">AED '+fmtMoney(s.amt)+'</span></div>';
  }).join("")+'</div>';
}

/* ---------- business-timezone date helpers ----------
   Pan Home's operations are UAE-based; the business timezone is Asia/Dubai
   (UTC+4, no DST, so a fixed offset is exact, not an approximation). All
   Follow-up date-range boundaries are computed in this timezone and then
   converted to UTC ms for querying createdAt (which the backend always
   stores/returns as a UTC ISO string) — never the viewer's own browser
   timezone, which would otherwise make "Today" mean a different window for
   an agent whose laptop clock is set to a different country. */
var BUSINESS_TZ_OFFSET_MIN = 240;
function fuLocalDateStr(d){
  var t = new Date(d.getTime() + BUSINESS_TZ_OFFSET_MIN*60000);
  return t.getUTCFullYear()+"-"+pad2(t.getUTCMonth()+1)+"-"+pad2(t.getUTCDate());
}
function fuTodayLocal(){ return fuLocalDateStr(new Date()); }
function fuAddDaysLocal(dateStr, n){
  var d = new Date(dateStr+"T00:00:00.000Z"); d.setUTCDate(d.getUTCDate()+n);
  return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate());
}
// Converts an INCLUSIVE local business-tz calendar-date range into
// [fromUTCms, toUTCmsExclusive) for filtering createdAt.
function fuLocalRangeToUTC(fromStr, toStr){
  var from = new Date(fromStr+"T00:00:00.000Z").getTime() - BUSINESS_TZ_OFFSET_MIN*60000;
  var toNext = new Date(toStr+"T00:00:00.000Z").getTime() - BUSINESS_TZ_OFFSET_MIN*60000 + 86400000;
  return { fromUTC: from, toUTC: toNext };
}
function fuPresetRange(preset, customFrom, customTo){
  var today = fuTodayLocal();
  if(preset==="today") return { from: today, to: today };
  if(preset==="prev3") return { from: fuAddDaysLocal(today,-3), to: fuAddDaysLocal(today,-1) }; // 3 complete days, excluding today
  if(preset==="lastWeek"){
    var d = new Date(today+"T00:00:00.000Z");
    var dow = d.getUTCDay(); // 0=Sun..6=Sat
    var mondayThisWeek = fuAddDaysLocal(today, -(dow===0?6:dow-1));
    var lastSun = fuAddDaysLocal(mondayThisWeek, -1);
    var lastMon = fuAddDaysLocal(lastSun, -6);
    return { from: lastMon, to: lastSun };
  }
  if(preset==="thisMonth") return { from: today.slice(0,8)+"01", to: today };
  if(preset==="custom") return { from: customFrom||today, to: customTo||today };
  return { from: today, to: today };
}
function fuPresetLabel(preset){
  return {today:"Today", prev3:"Previous 3 Days", lastWeek:"Last Week", thisMonth:"This Month", custom:"Custom"}[preset] || preset;
}
function fuAgentUsernames(){
  return state.users.filter(function(u){ return String(u.username||"").toLowerCase()!==FOLLOWUP_SUPER_ADMIN_USERNAME; })
    .map(function(u){ return u.username; }).sort();
}

/* ---------- data fetch (debounced, stale-response-safe) ---------- */
var _fuFetchTimer = null;
function fuFetchDataDebounced(){ clearTimeout(_fuFetchTimer); _fuFetchTimer = setTimeout(fuFetchData, 220); }
function fuFetchData(){
  if(!state.currentUser) return;
  if(state.fu.preset==="custom" && (!state.fu.customFrom || !state.fu.customTo || state.fu.customFrom > state.fu.customTo)){
    render(); return; // invalid custom range — show the inline error instead of querying
  }
  var range = fuPresetRange(state.fu.preset, state.fu.customFrom, state.fu.customTo);
  var utc = fuLocalRangeToUTC(range.from, range.to);
  var mySeq = ++state.fu._reqSeq;
  state.fu.loading = true;
  var isAdmin = isFollowupSuperAdminClient();
  var q = { fromUTC: utc.fromUTC, toUTC: utc.toUTC, agent: isAdmin ? state.fu.agentFilter : "" };
  var calls = [ apiCall("fu_kpis", { caller: callerCred(), query: q }), apiCall("fu_list", { caller: callerCred(), query: q }) ];
  if(isAdmin) calls.push(apiCall("fu_adminOverview", { caller: callerCred(), query: q }));
  Promise.all(calls).then(function(res){
    if(mySeq !== state.fu._reqSeq) return; // a newer request has since been issued — discard this stale one
    state.fu.kpis = res[0];
    state.fu.cases = (res[1].cases||[]).map(function(r){
      r.createdAt = toMs(r.createdAt); r.lastUpdate = toMs(r.lastUpdate);
      r.nextFollowupAt = r.nextFollowupAt ? toMs(r.nextFollowupAt) : null;
      return r;
    });
    if(isAdmin) state.fu.adminOverview = res[2];
    state.fu.loading = false;
    state.fu.range = range;
    render();
  }).catch(function(e){
    if(mySeq !== state.fu._reqSeq) return;
    state.fu.loading = false;
    toast("Couldn't load Follow-up data: "+e.message);
    render();
  });
}
// The server already returns only cases this caller is authorized to see
// (fu_list/fu_kpis enforce ownership) — everything below filters that
// already-authorized set client-side, exactly like the existing
// Requests/Dashboard pages do with getAll(); it never widens what's shown.
function fuFilteredRows(){
  var rows = state.fu.cases.slice();
  var range = state.fu.range;
  // Overdue is a live snapshot, independent of the creation-date range (see
  // the matching comment in fuKpis() on the backend) — every other KPI
  // filter (and the unfiltered/"Total" view) stays scoped to the range.
  if(state.fu.kpiFilter !== "overdue" && range){
    var utc = fuLocalRangeToUTC(range.from, range.to);
    rows = rows.filter(function(r){ return r.createdAt>=utc.fromUTC && r.createdAt<utc.toUTC; });
  }
  if(state.fu.kpiFilter==="remaining") rows = rows.filter(function(r){ return r.resolutionStatus!=="resolved"; });
  else if(state.fu.kpiFilter==="resolved") rows = rows.filter(function(r){ return r.resolutionStatus==="resolved"; });
  else if(state.fu.kpiFilter==="overdue") rows = rows.filter(function(r){ return r.overdue; });
  if(state.fu.statusFilter) rows = rows.filter(function(r){ return r.resolutionStatus===state.fu.statusFilter; });
  if(state.fu.priorityFilter) rows = rows.filter(function(r){ return r.priority===state.fu.priorityFilter; });
  if(state.fu.search){
    var q = state.fu.search.toLowerCase();
    rows = rows.filter(function(r){
      var hay = [r.id,r.orderNumber,r.customerName,r.complaintRef,r.brief,r.assignedAgent].join(" ").toLowerCase();
      var textMatch = hay.indexOf(q)!==-1;
      var phoneMatch = /\d/.test(state.fu.search) ? mobileMatches(r.callerPhone, state.fu.search) : false;
      return textMatch || phoneMatch;
    });
  }
  rows.sort(function(a,b){ return b.createdAt - a.createdAt; });
  return rows;
}
function fuPaginate(rows){
  var totalPages = Math.max(1, Math.ceil(rows.length/FU_PAGE_SIZE));
  var page = Math.min(Math.max(1,state.fu.page), totalPages);
  var start = (page-1)*FU_PAGE_SIZE;
  return { page:page, totalPages:totalPages, slice: rows.slice(start, start+FU_PAGE_SIZE) };
}

/* ---------- reminder polling + popup ---------- */
function fuPollReminders(){
  if(!state.currentUser) return;
  apiCall("fu_dueReminders", { caller: callerCred() }).then(function(res){
    var list = res.reminders||[];
    var known = {};
    if(state.fu.activeReminder) known[state.fu.activeReminder.logId]=true;
    state.fu.reminderQueue.forEach(function(r){ known[r.logId]=true; });
    list.forEach(function(r){ if(!known[r.logId]) state.fu.reminderQueue.push(r); });
    if(!state.fu.activeReminder && state.fu.reminderQueue.length) state.fu.activeReminder = state.fu.reminderQueue.shift();
    renderOverlays(); // popup lives outside #app — never needs a full render()
  }).catch(function(){});
}
function fuAdvanceReminderQueue(){ state.fu.activeReminder = state.fu.reminderQueue.length ? state.fu.reminderQueue.shift() : null; }
function fuReminderOpenCase(){
  var r = state.fu.activeReminder; if(!r) return;
  apiCall("fu_ackReminder", { caller: callerCred(), logId:r.logId, ackAction:"open" }).catch(function(){});
  state.route = "followup"; state.fu.view = "open"; state.fu.openCaseId = r.caseId;
  fuAdvanceReminderQueue();
  fuOpenCaseLoad(r.caseId);
  render(); // explicit navigation — a full repaint is expected here
}
function fuReminderSnooze(){
  var r = state.fu.activeReminder; if(!r) return;
  apiCall("fu_snooze", { caller: callerCred(), id:r.caseId }).then(function(){ toast("Snoozed."); })
    .catch(function(e){ toast("Couldn't snooze: "+fuErrText(e.message)); });
  apiCall("fu_ackReminder", { caller: callerCred(), logId:r.logId, ackAction:"snooze" }).catch(function(){});
  fuAdvanceReminderQueue();
  renderOverlays();
}
function fuReminderMarkContacted(){
  var r = state.fu.activeReminder; if(!r) return;
  apiCall("fu_contactAttempt", { caller: callerCred(), id:r.caseId, outcome:"Answered", notes:"Marked contacted from the reminder popup" })
    .then(function(){ return apiCall("fu_completeTask", { caller: callerCred(), id:r.caseId, outcome:"Answered" }); })
    .then(function(){
      toast("Marked contacted — reminders stopped for this follow-up.");
      if(state.route==="followup" && state.fu.view==="list") fuFetchDataDebounced();
      if(state.route==="followup" && state.fu.view==="open" && state.fu.openCaseId===r.caseId) fuOpenCaseLoad(r.caseId);
    })
    .catch(function(e){ toast("Couldn't update: "+fuErrText(e.message)); });
  apiCall("fu_ackReminder", { caller: callerCred(), logId:r.logId, ackAction:"contacted" }).catch(function(){});
  fuAdvanceReminderQueue();
  renderOverlays();
}

function fuChatRefresh(){
  if(!state.currentUser) return;

    (rows || '<tr><td colspan="8"><p class="sub">No data for the selected period.</p></td></tr>')+

function fuExportAdminOverviewXlsx(){
  if(typeof XLSX==="undefined"){ toast("Excel library didn't load — check your connection and try again."); return; }
  var data = state.fu.adminOverview || { agents:[] };
  var wb = XLSX.utils.book_new();
  var agentHeader = ["Agent","Total","Remaining","Resolved","Not Resolved","Overdue","Last Activity"];
  var agentRows = [agentHeader].concat(data.agents.map(function(a){
    return [a.agent, a.total, a.remaining, a.resolved, a.notResolved, a.overdue, a.lastActivity?fmtDate(a.lastActivity):""];
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(agentRows), "By Agent");
  var caseHeader = ["Case ID","Order","Customer","Caller Phone","Agent","Priority","Resolution Status","Follow-up Status","Next Follow-up","Last Note","Last Update"];
  var caseRows = [caseHeader].concat(state.fu.cases.map(function(r){
    return [r.id, r.orderNumber, r.customerName, r.callerPhone, r.assignedAgent, r.priority,
      FU_RESOLUTION_LABELS[r.resolutionStatus]||r.resolutionStatus, r.followupStatus,
      r.nextFollowupAt?fmtDate(r.nextFollowupAt):"", r.lastNote, fmtDate(r.lastUpdate)];
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(caseRows), "Cases (current filter)");
  XLSX.writeFile(wb, "PanHome_Followup_AdminOverview.xlsx");
  toast("Excel exported — "+state.fu.cases.length+" case(s).");
}

  var ct=$("#fuCustomTo"); if(ct) ct.addEventListener("change", function(){ state.fu.customTo=this.value; state.fu.page=1; fuFetchDataDebounced(); render(); });

/* ---------- New Follow-up form ---------- */
function fuDefaultDueDate(){
  // A real future date/time computed at render time, never a fixed calendar
  // date — defaults to today at 14:30 (or tomorrow if 14:30 already passed).
  var d = new Date(); d.setHours(14,30,0,0);
  if(d.getTime() <= Date.now()) d.setDate(d.getDate()+1);
  return d;
}
function fuDateTimeLocalValue(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes()); }

            .map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join("")+

        SOURCES.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join("")+

function wireFollowupNew(){
  var back = $("#fuBackToList"); if(back) back.addEventListener("click", function(){ state.fu.view="list"; render(); });
  var orderEl = $("#fuOrderNumber");
  if(orderEl) orderEl.addEventListener("input", function(){
    // Link to an existing Cancel-Desk order only on an UNAMBIGUOUS exact
    // match — never on a phone-number match alone, and never silently
    // overwriting a name the agent already typed.
    var v = this.value.trim().toUpperCase();
    var f = fieldOf(this);
    var hintEl = f && f.querySelector(".hint");
    if(!hintEl && f){ hintEl = document.createElement("div"); hintEl.className="hint"; f.appendChild(hintEl); }
    if(!hintEl) return;
    if(!v){ hintEl.textContent=""; return; }
    var matches = state.requests.filter(function(r){ return (r.lnOrder||"").toUpperCase()===v || (r.webOrderNumber||"").toUpperCase()===v; });
    if(matches.length===1){
      hintEl.textContent = "Matched existing order — "+(matches[0].customerName||"customer")+(matches[0].customerCode?(" ("+matches[0].customerCode+")"):"")+".";
      var nameEl = $("#fuCustomerName");
      if(nameEl && !nameEl.value) nameEl.value = matches[0].customerName||"";
    } else if(matches.length>1){
      hintEl.textContent = "Multiple orders share this number — not auto-linking.";
    } else {
      hintEl.textContent = "";
    }
  });
  var form = $("#fuNewForm");
  if(form) form.addEventListener("submit", function(e){
    e.preventDefault();
    clearInvalidFields();
    var phoneEl=$("#fuCallerPhone"), briefEl=$("#fuBrief"), dueEl=$("#fuDueAt");
    var firstBad=null; function fail(el){ markField(el,true); if(!firstBad) firstBad=el; }
    if(!phoneEl.value.trim()) fail(phoneEl);
    if(!briefEl.value.trim()) fail(briefEl);
    var dueDate = dueEl.value ? new Date(dueEl.value) : null;
    if(!dueDate || isNaN(dueDate.getTime()) || dueDate.getTime()<=Date.now()) fail(dueEl);
    if(firstBad){ toast("Please fix the field(s) highlighted in red."); firstBad.focus(); return; }
    var data = {
      orderNumber: $("#fuOrderNumber").value.trim(), callerPhone: phoneEl.value.trim(),
      customerName: $("#fuCustomerName").value.trim(), complaintRef: $("#fuComplaintRef").value.trim(),
      brief: briefEl.value.trim(), notes: $("#fuNotes").value.trim(),
      priority: $("#fuPriority").value, department: $("#fuDepartment").value,
      dueAt: dueDate.toISOString(), alertFrom: $("#fuAlertFrom").value, alertTo: $("#fuAlertTo").value,
      repeatIntervalMin: parseInt($("#fuRepeatMin").value,10)||15, snoozeDefaultMin: parseInt($("#fuSnoozeMin").value,10)||10,
      source: $("#fuSource").value,
      assignedAgent: ($("#fuAssignedAgent")||{}).value || state.currentUser.username
    };
    apiCall("fu_createCase", { caller: callerCred(), data: data }).then(function(){
      toast("Follow-up created.");
      state.fu.view = "list";
      fuFetchData();
    }).catch(function(e){ toast("Couldn't create follow-up: "+fuErrText(e.message)); });
  });
}

/* ---------- Open Case detail ---------- */
function fuOpenCaseLoad(id){
  state.fu.caseDetail = null;
  apiCall("fu_get", { caller: callerCred(), id: id }).then(function(res){
    state.fu.caseDetail = res;
    render();
  }).catch(function(e){
    toast("Couldn't open case: "+fuErrText(e.message));
    state.fu.view = "list";
    render();
  });
}
function fuNoteTypeLabel(t){
  return { note:"Note", call:"Call", status_change:"Status Change", snooze:"Snooze", reschedule:"Reschedule", handoff:"Handoff", instruction:"Instruction" }[t] || "Note";
}
// Every mutating action already writes a FU_Notes row server-side (see
// apps-script-backend.gs), so the notes list alone is a complete,
// chronological, immutable activity trail — only "case opened" (recorded
// directly in status history, not as a note) needs adding separately here.
function fuBuildTimeline(d){
  var c = d.case;
  var ev = [{ at: toMs(c.createdAt), who: c.createdBy, label: "Case opened", text: "" }];
  (d.notes||[]).forEach(function(n){ ev.push({ at: toMs(n.createdAt), who: n.author, label: fuNoteTypeLabel(n.type), text: n.text }); });
  ev.sort(function(a,b){ return a.at-b.at; });
  return ev;
}
function renderFollowupOpen(){
  var d = state.fu.caseDetail;
  if(!d) return '<div class="card"><p class="sub">Loading case…</p></div>';
  var c = d.case;
  var task = (d.tasks||[]).filter(function(t){ return t.status==="scheduled"; }).sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); })[0];
  var canEdit = isFollowupSuperAdminClient() || String(c.assignedAgent||"").toLowerCase()===state.currentUser.username.toLowerCase();

  var header = '<div class="card">'+
    '<div class="btnrow" style="justify-content:space-between;flex-wrap:wrap">'+
      '<div><h2 style="margin:0">Open Customer Case</h2><p class="sub" style="margin:2px 0 0">Case FU-'+esc(c.id.split("-").pop())+'</p></div>'+
      '<div class="btnrow">'+fuPriorityBadge(c.priority)+fuFollowupStatusBadge(task?task.status:"none")+fuResolutionBadge(c.resolutionStatus)+'</div>'+
    '</div>'+
    '<button type="button" class="linkbtn" id="fuBackToList2" style="margin-top:8px">‹ Back to list</button>'+
  '</div>';

  var summary = '<div class="card"><h2 style="font-size:14.5px">Summary</h2>'+
    '<div class="note-box">'+esc(c.brief)+'</div>'+
    '<div class="kv">'+
      '<div><div class="k">Due</div><div class="vv">'+(task?fmtDate(toMs(task.dueAt)):"—")+'</div></div>'+
      '<div><div class="k">Alert Window</div><div class="vv">'+(task?(esc(task.alertFrom)+' – '+esc(task.alertTo)):"—")+'</div></div>'+
      '<div><div class="k">Repeat / Snooze</div><div class="vv">'+(task?("every "+esc(task.repeatIntervalMin)+" min / snooze "+esc(task.snoozeDefaultMin)+" min"):"—")+'</div></div>'+
      '<div><div class="k">Owner</div><div class="vv">'+esc(c.assignedAgent)+'</div></div>'+
      '<div><div class="k">Last Update</div><div class="vv">'+fmtDate(toMs(c.lastUpdate))+'</div></div>'+
      '<div><div class="k">Created</div><div class="vv">'+fmtDate(toMs(c.createdAt))+' by '+esc(c.createdBy)+'</div></div>'+
    '</div></div>';

  var custCard = '<div class="card"><h2 style="font-size:14.5px">Customer</h2><div class="kv" style="grid-template-columns:1fr">'+
    '<div><div class="k">Name</div><div class="vv">'+(c.customerName?esc(c.customerName):"—")+'</div></div>'+
    '<div><div class="k">Phone</div><div class="vv">'+(c.callerPhone?esc(c.callerPhone):"—")+'</div></div>'+
    '<div><div class="k">Complaint Reference</div><div class="vv">'+(c.complaintRef?esc(c.complaintRef):"—")+'</div></div>'+
  '</div></div>';
  var orderCard = '<div class="card"><h2 style="font-size:14.5px">Order</h2><div class="kv" style="grid-template-columns:1fr">'+
    '<div><div class="k">Order Number</div><div class="vv">'+(c.orderNumber?esc(c.orderNumber):"—")+'</div></div>'+
    '<div><div class="k">Department</div><div class="vv">'+(c.department?esc(c.department):"—")+'</div></div>'+
    '<div><div class="k">Source</div><div class="vv">'+(c.source?esc(c.source):"—")+'</div></div>'+
  '</div></div>';
  var twoCol = '<div class="chartgrid">'+custCard+orderCard+'</div>';

  var resBtns = canEdit ? (
    '<div class="btnrow" style="flex-wrap:wrap;gap:8px">'+
      '<button class="btn sm" data-fu-resolve="pending">Pending</button>'+
      '<button class="btn good sm" data-fu-resolve="resolved">Resolved</button>'+
      '<button class="btn bad sm" data-fu-resolve="not_resolved">Not Resolved</button>'+
      '<button class="btn info sm" data-fu-resolve="reopened">Reopened</button>'+
    '</div>'+
    '<div class="opsbox" id="fuResolveBox" hidden style="margin-top:10px">'+
      '<div class="field" id="fuResolveNoteField" style="margin-bottom:10px"><label>Resolution Note (required for Resolved)</label><textarea id="fuResolveNote"></textarea></div>'+
      '<div class="field" id="fuResolveReasonField" style="margin-bottom:10px"><label>Reason (required for Not Resolved)</label><textarea id="fuResolveReason"></textarea></div>'+
      '<div class="field" id="fuResolveNextField" style="margin-bottom:10px"><label>Next Step (required for Not Resolved — new follow-up or documented handoff)</label><textarea id="fuResolveNext"></textarea></div>'+
      '<button type="button" class="btn good sm" id="fuResolveSave">Save</button>'+
    '</div>'
  ) : '<p class="sub">Only the assigned agent or the admin can change this case.</p>';
  var resolution = '<div class="card"><h2 style="font-size:14.5px">Case Resolution</h2>'+resBtns+'</div>';

  var timeline = fuBuildTimeline(d);
  var timelineHtml = '<div class="card"><h2 style="font-size:14.5px">Notes &amp; Activity</h2><div class="history">'+
    (timeline.length ? timeline.map(function(ev){
      return '<div class="hrow"><span class="t">'+fmtDate(ev.at)+'</span><span><b>'+esc(ev.who)+'</b> — '+esc(ev.label)+(ev.text?(': '+esc(ev.text)):'')+'</span></div>';
    }).join("") : '<p class="sub">No activity yet.</p>')+
  '</div></div>';

  var addNote = canEdit ? ('<div class="card"><h2 style="font-size:14.5px">Add Note</h2>'+
    '<textarea id="fuAddNoteText" placeholder="Add a note…"></textarea>'+
    '<div class="btnrow" style="margin-top:10px"><button class="btn sm" id="fuAddNoteBtn">Save Note</button></div>'+
  '</div>') : '';

  var contactAttempt = canEdit ? ('<div class="card"><h2 style="font-size:14.5px">Contact Attempt</h2>'+
    '<div class="field" style="margin-bottom:10px"><label>Outcome</label><select id="fuContactOutcome">'+
      FU_CONTACT_OUTCOMES.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join("")+
    '</select></div>'+
    '<div class="field" style="margin-bottom:10px"><label>Notes</label><textarea id="fuContactNotes"></textarea></div>'+
    '<button class="btn sm" id="fuContactSaveBtn">Log Contact Attempt</button>'+
  '</div>') : '';

  var completeReschedule = canEdit ? (task ? (
    '<div class="card"><h2 style="font-size:14.5px">This Follow-up</h2>'+
      '<div class="btnrow" style="flex-wrap:wrap;gap:8px">'+
        '<button class="btn good sm" id="fuCompleteBtn">✅ Complete Follow-up</button>'+
        '<button class="btn sm" id="fuRescheduleToggle">🔁 Reschedule</button>'+
      '</div>'+
      '<div class="opsbox" id="fuCompleteBox" hidden style="margin-top:10px">'+
        '<div class="field" style="margin-bottom:10px"><label>Outcome</label><select id="fuCompleteOutcome">'+
          FU_CONTACT_OUTCOMES.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join("")+
        '</select></div>'+
        '<div class="field" style="margin-bottom:10px"><label>Notes</label><textarea id="fuCompleteNotes"></textarea></div>'+
        '<p class="sub">This stops reminders for this follow-up. It does NOT resolve the customer issue — use Case Resolution above for that.</p>'+
        '<button class="btn good sm" id="fuCompleteSave">Save</button>'+
      '</div>'+
      '<div class="opsbox" id="fuRescheduleBox" hidden style="margin-top:10px">'+
        '<div class="field" style="margin-bottom:10px"><label>New Due Date/Time *</label><input type="datetime-local" id="fuRescheduleDue"></div>'+
        '<div class="field" style="margin-bottom:10px"><label>Reason *</label><textarea id="fuRescheduleReason"></textarea></div>'+
        '<button class="btn good sm" id="fuRescheduleSave">Save</button>'+
      '</div>'+
    '</div>'
  ) : '<div class="card"><p class="sub">No active follow-up task on this case (it was already completed, cancelled, or superseded). Resolve the case above, or go back and open a new follow-up.</p></div>') : '';

  var reassignBox = isFollowupSuperAdminClient() ? ('<div class="card"><h2 style="font-size:14.5px">Reassign</h2>'+
    '<div class="btnrow"><select id="fuReassignTo">'+
      fuAgentUsernames().map(function(a){ return '<option value="'+esc(a)+'" '+(a===c.assignedAgent?"selected":"")+'>'+esc(a)+'</option>'; }).join("")+
    '</select><button class="btn sm" id="fuReassignBtn">Reassign</button></div>'+
  '</div>') : '';

  return header+summary+twoCol+resolution+timelineHtml+addNote+contactAttempt+completeReschedule+reassignBox;
}
function wireFollowupOpen(){
  var b1=$("#fuBackToList2"); if(b1) b1.addEventListener("click", function(){ state.fu.view="list"; state.fu.caseDetail=null; fuFetchData(); });
  var d = state.fu.caseDetail; if(!d) return;
  var c = d.case;

  $all("[data-fu-resolve]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var box = $("#fuResolveBox"); if(!box) return;
      var status = btn.dataset.fuResolve;
      box.hidden = false;
      box.dataset.target = status;
      $("#fuResolveNoteField").style.display = status==="resolved" ? "" : "none";
      $("#fuResolveReasonField").style.display = status==="not_resolved" ? "" : "none";
      $("#fuResolveNextField").style.display = status==="not_resolved" ? "" : "none";
    });
  });
  var saveRes = $("#fuResolveSave");
  if(saveRes) saveRes.addEventListener("click", function(){
    var box = $("#fuResolveBox");
    var status = box.dataset.target;
    apiCall("fu_setResolution", { caller: callerCred(), id:c.id, status:status,
      resolutionNote: $("#fuResolveNote").value.trim(), reason: $("#fuResolveReason").value.trim(), nextStep: $("#fuResolveNext").value.trim()
    }).then(function(){ toast("Resolution updated."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });

  var addNoteBtn = $("#fuAddNoteBtn");
  if(addNoteBtn) addNoteBtn.addEventListener("click", function(){
    var t = $("#fuAddNoteText").value.trim();
    if(!t){ toast("Write a note first."); return; }
    apiCall("fu_addNote", { caller: callerCred(), id:c.id, text:t, type:"note" })
      .then(function(){ toast("Note added."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });

  var contactBtn = $("#fuContactSaveBtn");
  if(contactBtn) contactBtn.addEventListener("click", function(){
    apiCall("fu_contactAttempt", { caller: callerCred(), id:c.id, outcome:$("#fuContactOutcome").value, notes:$("#fuContactNotes").value.trim() })
      .then(function(){ toast("Contact attempt logged."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });

  var completeBtn = $("#fuCompleteBtn");
  if(completeBtn) completeBtn.addEventListener("click", function(){ $("#fuCompleteBox").hidden=false; $("#fuRescheduleBox").hidden=true; });
  var completeSave = $("#fuCompleteSave");
  if(completeSave) completeSave.addEventListener("click", function(){
    apiCall("fu_completeTask", { caller: callerCred(), id:c.id, outcome:$("#fuCompleteOutcome").value, notes:$("#fuCompleteNotes").value.trim() })
      .then(function(){ toast("Follow-up completed — reminders stopped."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });

  var reschedToggle = $("#fuRescheduleToggle");
  if(reschedToggle) reschedToggle.addEventListener("click", function(){ $("#fuRescheduleBox").hidden=false; $("#fuCompleteBox").hidden=true; });
  var reschedSave = $("#fuRescheduleSave");
  if(reschedSave) reschedSave.addEventListener("click", function(){
    var dueVal = $("#fuRescheduleDue").value;
    var due = dueVal ? new Date(dueVal) : null;
    if(!due || isNaN(due.getTime()) || due.getTime()<=Date.now()){ toast("Pick a future date/time."); return; }
    var reason = $("#fuRescheduleReason").value.trim();
    if(!reason){ toast("A reason is required."); return; }
    apiCall("fu_reschedule", { caller: callerCred(), id:c.id, dueAt: due.toISOString(), reason: reason })
      .then(function(){ toast("Rescheduled."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });

  var reassignBtn = $("#fuReassignBtn");
  if(reassignBtn) reassignBtn.addEventListener("click", function(){
    var sel = $("#fuReassignTo");
    apiCall("fu_reassign", { caller: callerCred(), id:c.id, toAgent: sel.value })
      .then(function(){ toast("Reassigned."); fuOpenCaseLoad(c.id); }).catch(function(e){ toast(fuErrText(e.message)); });
  });
}

/* ---------- top-level dispatch ---------- */
function renderFollowup(){
  if(state.fu.view==="new") return renderFollowupNew();
  if(state.fu.view==="open") return renderFollowupOpen();
  return renderFollowupList();
}
function wireFollowup(){
  if(state.fu.view==="new"){ wireFollowupNew(); return; }
  if(state.fu.view==="open"){ wireFollowupOpen(); return; }
  wireFollowupListPage();
}

boot();
})();
