<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan Home Cancel Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F6; --surface:#FFFFFF; --surface-2:#EEF2F2; --border:#DDE3E3;
  --ink:#16222A; --ink-muted:#5B6B72; --ink-faint:#8A96A0;
  --accent:#0D9488; --accent-ink:#FFFFFF; --accent-soft:#E3F3F1;
  --good:#16A34A; --good-soft:#E3F6E9; --warn:#B45309; --warn-soft:#FDF1DD; --info:#2563EB; --info-soft:#E6EDFC; --bad:#B91C1C; --bad-soft:#FBE4E4;
  --cat-1:#0D9488; --cat-2:#7C3AED; --cat-3:#C2410C; --cat-4:#0369A1; --cat-5:#A16207; --cat-6:#BE185D;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 8px 24px -12px rgba(20,30,30,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171A; --surface:#182124; --surface-2:#1E2A2D; --border:#2B3A3D;
    --ink:#EAF1F1; --ink-muted:#A7B6B8; --ink-faint:#71848A;
    --accent:#14B8A6; --accent-ink:#06211E; --accent-soft:#19302C;
    --good:#4ADE80; --good-soft:#163424; --warn:#F5A524; --warn-soft:#3A2A10; --info:#60A5FA; --info-soft:#17263E; --bad:#F87171; --bad-soft:#3A1A1A;
    --cat-1:#0D9488; --cat-2:#9061F9; --cat-3:#EA580C; --cat-4:#0284C7; --cat-5:#A16207; --cat-6:#DB2777;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171A; --surface:#182124; --surface-2:#1E2A2D; --border:#2B3A3D;
  --ink:#EAF1F1; --ink-muted:#A7B6B8; --ink-faint:#71848A;
  --accent:#14B8A6; --accent-ink:#06211E; --accent-soft:#19302C;
  --good:#4ADE80; --good-soft:#163424; --warn:#F5A524; --warn-soft:#3A2A10; --info:#60A5FA; --info-soft:#17263E; --bad:#F87171; --bad-soft:#3A1A1A;
  --cat-1:#0D9488; --cat-2:#9061F9; --cat-3:#EA580C; --cat-4:#0284C7; --cat-5:#A16207; --cat-6:#DB2777;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3,.brand{font-family:"Manrope",-apple-system,Segoe UI,sans-serif}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit}
::selection{background:var(--accent-soft)}
img{max-width:100%}
[hidden]{display:none!important}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 0;background:var(--surface);border-bottom:1px solid var(--border);margin:0 -16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;min-width:0}
.tab{padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.active{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:1px solid var(--border)}
.rolepill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-muted)}
.linkbtn{background:none;border:none;color:var(--ink-muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.linkbtn:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:20px 0 60px}
.view{display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--ink-muted);font-size:13px;margin:0 0 14px}

label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:5px;letter-spacing:.01em}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);
  font-size:14px;font-family:inherit;min-width:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:0;min-width:0}
.field .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;min-height:0}
.field .hint.warn{color:var(--bad);font-weight:600}
.field.invalid label{color:var(--bad)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.field .err{font-size:11.5px;color:var(--bad);margin-top:4px;min-height:0}
.field.na input,.field.na select{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.cols2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.grid,.grid.cols2{grid-template-columns:1fr}}

.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.approved{background:var(--good-soft);color:var(--good)}
.badge.sent{background:var(--info-soft);color:var(--info)}
.badge.closed{background:var(--good-soft);color:var(--good)}
.badge.store{background:var(--surface-2);color:var(--ink-muted)}
.badge.online{background:var(--accent-soft);color:var(--accent)}
.badge.retained{background:var(--good-soft);color:var(--good)}
.badge.notretained{background:var(--bad-soft);color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-family:"Manrope",sans-serif}
.kpi .sub{font-size:12px;color:var(--ink-faint);margin-top:2px}

.scopebar{display:flex;gap:6px;background:var(--surface-2);padding:3px;border-radius:9px;width:max-content}
.scopebar button{border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer}
.scopebar button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chartgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:900px){.chartgrid{grid-template-columns:1fr}}
.newreq-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.newreq-layout{grid-template-columns:1fr}}
.hbarlist{display:flex;flex-direction:column;gap:9px}
.hbarrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;min-width:0}
.hbarrow .lbl{font-size:12.5px;color:var(--ink-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbartrack{background:var(--surface-2);border-radius:5px;height:10px;overflow:hidden;min-width:0}
.hbarfill{height:100%;border-radius:5px;background:var(--accent)}
.hbarrow .v{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px}
.legend .item{display:flex;align-items:center;gap:6px;color:var(--ink-muted)}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;z-index:100;opacity:0;transition:opacity .08s;white-space:nowrap;box-shadow:var(--shadow)}

.reqlist{display:flex;flex-direction:column;gap:10px}
.reqcard{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.reqhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.reqhead .id{font-weight:800;font-size:13px;font-family:"Manrope",sans-serif}
.reqhead .meta{color:var(--ink-faint);font-size:12px}
.reqhead .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.reqhead .chev{color:var(--ink-faint);transition:transform .15s}
.reqsummary{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 14px 12px;font-size:12px;color:var(--ink-muted);cursor:pointer;align-items:center}
.reqsummary span{white-space:nowrap}
.reqcard.open .chev{transform:rotate(90deg)}
.reqbody{border-top:1px solid var(--border);padding:14px;display:none}
.reqcard.open .reqbody{display:block}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12.5px;margin-bottom:12px}
@media (max-width:760px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv .k{color:var(--ink-faint);text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.kv .vv{margin-top:2px;font-weight:600}
.note-box{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;white-space:pre-wrap}
.history{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.hrow{display:flex;gap:8px;font-size:12px;color:var(--ink-muted)}
.hrow .t{color:var(--ink-faint);white-space:nowrap}
.opsbox{background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:4px}
.opsbox label{color:var(--ink-muted)}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filterbar .field{width:160px}
.filterbar .field.grow{flex:1;min-width:180px}

.empty{text-align:center;padding:44px 20px;color:var(--ink-muted)}
.empty .big{font-size:34px;margin-bottom:8px}

.loginwrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.loginbox{width:100%;max-width:380px}
.loginbox .brand{justify-content:center;font-size:20px;margin-bottom:4px}
.loginbox .tag{text-align:center;color:var(--ink-muted);font-size:13px;margin-bottom:22px}
.switcher{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;margin-bottom:16px}
.switcher button{flex:1;border:none;background:transparent;padding:8px;border-radius:7px;font-weight:700;font-size:13px;color:var(--ink-muted);cursor:pointer}
.switcher button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.roletoggle{display:flex;gap:8px}
.roletoggle label{flex:1;border:1px solid var(--border);border-radius:9px;padding:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-muted);margin:0}
.roletoggle input{display:none}
.roletoggle label.checked{border-color:var(--accent);background:var(--accent-soft)}
.formerr{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;bottom:max(18px, env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

table.teamtbl{width:100%;border-collapse:collapse;font-size:13px}
table.teamtbl th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border)}
table.teamtbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ========================================================================
   CONFIG — fill in API_URL after deploying the Apps Script Web App.
   ======================================================================== */
var API_URL = "https://script.google.com/macros/s/AKfycbzrD3Arlt2B-CzpIMgv9Npplm_m7AIDGoTRd_ZOpCX5YztpVZV0Zlqqm0Rc9pgQ5j5-fg/exec";
var API_KEY = "daQs4oFH4psq9jc9p8d669jFtm1Q7tBq";

/* ---------- constants ---------- */
var REASONS = [
  "Change of Mind","Found a Better Price Elsewhere","Delivery Delay / Long Lead Time",
  "Item Out of Stock / Discontinued","Wrong Item Ordered","Wrong Size / Does Not Fit Space",
  "Duplicate Order","Found a Better Design / Alternative","Product Quality Concern (Reviews/Photos)",
  "Payment Failed / Payment Issue","Can No Longer Afford the Item","Relocating / Moving Plans Changed",
  "Assembly / Installation Concerns","Ordered by Mistake","Prefers Exchange Instead of Cancellation",
  "Delivery Address Problem","Suspected Fraudulent Order","Other (Specify in Notes)"
];
var REGIONS = [
  {code:"UAE",label:"United Arab Emirates"},
  {code:"KSA",label:"Saudi Arabia"},
  {code:"QAT",label:"Qatar"},
  {code:"OMN",label:"Oman"}
];
/* Each region's native currency, and its approximate fixed AED equivalent (GCC
   currencies are pegged to USD, so these are stable, not live FX rates). Amount
   is always entered and shown in the order's own currency; dashboard totals are
   converted to AED so they can be summed across regions. */
var CURRENCY_BY_REGION = {UAE:"AED", KSA:"SAR", QAT:"QAR", OMN:"OMR"};
var AED_PER_UNIT = {AED:1, SAR:0.9793, QAR:1.0091, OMR:9.5514};
function currencyFor(region){ return CURRENCY_BY_REGION[region] || "AED"; }
/* ETM is the internal order system; there's no documented deep-link parameter for
   opening one exact order, so this copies the order number to the clipboard and
   opens ETM's own search page (already logged in for the agent) to paste into. */
var ETM_URLS = {
  web: "https://etm.panemirates.ae/ordering/floor/order-search-web",
  ln:  "https://etm.panemirates.ae/ordering/floor/order-search"
};
function openInETM(kind, value){
  if(value){
    try{ navigator.clipboard && navigator.clipboard.writeText(value); toast("Copied "+value+" — paste it into ETM's search."); }
    catch(e){ toast("Opening ETM — paste "+value+" into the search."); }
  }
  window.open(ETM_URLS[kind]||ETM_URLS.ln, "_blank");
}
function toAED(amount, region){ return (Number(amount)||0) * (AED_PER_UNIT[currencyFor(region)]||1); }
function fmtCurrency(amount, region){ return currencyFor(region)+" "+fmtMoney(amount); }
/* Order-number prefix -> branch/region lookup (first 2 letters of the order number).
   Some prefixes are shared across countries (OS, SS) — ambiguous prefixes list every
   match instead of guessing, and the agent picks the right one. */
var PREFIX_MAP = {
  WU:[{region:"UAE",branch:"UAE Online",type:"Online"}], BS:[{region:"UAE",branch:"Barsha Store",type:"Store"}],
  TS:[{region:"UAE",branch:"Zahia Store",type:"Store"}], YS:[{region:"UAE",branch:"Marina Store",type:"Store"}],
  CS:[{region:"UAE",branch:"DFC Mall Store",type:"Store"}], IS:[{region:"UAE",branch:"Deerfields Mall Store",type:"Store"}],
  VS:[{region:"UAE",branch:"Festival Plaza Store",type:"Store"}], JS:[{region:"UAE",branch:"FJR Store",type:"Store"}],
  NS:[{region:"UAE",branch:"Al Ain Store",type:"Store"}],
  WK:[{region:"KSA",branch:"KSA Online",type:"Online"}], RS:[{region:"KSA",branch:"Riyadh Store",type:"Store"}],
  WO:[{region:"OMN",branch:"Oman Online",type:"Online"}], GS:[{region:"OMN",branch:"Ghoubrah Store",type:"Store"}],
  WQ:[{region:"QAT",branch:"Qatar Online",type:"Online"}], LS:[{region:"QAT",branch:"Salwa Store",type:"Store"}],
  ES:[{region:"QAT",branch:"QDFC Mall Store",type:"Store"}],
  SS:[{region:"UAE",branch:"Sharjah Store",type:"Store"},{region:"OMN",branch:"Salalah Store",type:"Store"}],
  OS:[{region:"KSA",branch:"Olaya Store",type:"Store"},{region:"OMN",branch:"Alhail Store",type:"Store"}]
};
var SOURCES = ["Call Center","Care Email","Store"];
var SCOPES = ["Whole Order","Specific Item(s)"];
var REFUND_METHODS = ["Same Payment Method","Credit Note","Cash on Delivery"];
var RETAIN_OPTIONS = ["Retained","Not Retained"];
/* Workflow: new -> approved/sent (store notified, kept from the original flow as an
   intermediate stage) -> one of the three closed "Cancelled ..." outcomes, picked
   automatically from the request's own Refund Via once Operations confirms the
   store processed it. "pending" is kept as an alias of "new" for requests raised
   before this status was renamed. */
var STATUS = {
  new:      {label:"New", cls:"pending"},
  pending:  {label:"New", cls:"pending"},
  approved: {label:"Approved & Sent to the Store", cls:"approved"},
  sent:     {label:"Sent to the Store", cls:"sent"},
  cancelled_refund: {label:"Cancelled with Refund Same Payment Method", cls:"closed"},
  cancelled_credit: {label:"Cancelled With Credit Note", cls:"closed"},
  cancelled_cdf:    {label:"Cancelled CDF", cls:"closed"}
};
var OPEN_STATUSES = ["new","pending","approved","sent"];
var CLOSED_STATUSES = ["cancelled_refund","cancelled_credit","cancelled_cdf"];
function finalStatusFor(refundMethod){
  if(refundMethod==="Credit Note") return "cancelled_credit";
  if(refundMethod==="Cash on Delivery") return "cancelled_cdf";
  return "cancelled_refund";
}

/* ---------- tiny helpers ---------- */
function esc(s){ s = (s==null?"":String(s)); var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(root,evt,sel,fn){ root.addEventListener(evt,function(e){ var t=e.target.closest(sel); if(t && root.contains(t)) fn(e,t); }); }
function pad2(n){ return n<10?"0"+n:""+n; }
function fmtDate(ts){ if(!ts) return "—"; var d=new Date(ts); if(isNaN(d.getTime())) return String(ts); return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg){
  var el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2800);
}
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
function startOfMonth(d){ var x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x.getTime(); }
function toMs(v){ var t = (typeof v==="number") ? v : new Date(v).getTime(); return isNaN(t) ? 0 : t; }

/* ---------- API client (Google Apps Script backend, no login required to call) ---------- */
function apiCall(action, payload){
  var body = Object.assign({ action: action, key: API_KEY }, payload||{});
  return fetch(API_URL, { method:"POST", body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error((j&&j.error)||"request_failed"); return j.data; });
}
function callerCred(){ return state.currentUser ? { username: state.currentUser.username, password: state.currentUser.password } : null; }

/* ---------- state ---------- */
var state = {
  currentUser:null,
  users:[],
  requests:[],
  route:"new",
  authMode:"login",
  dashScope:"month",
  dashRange:{from:"",to:""},
  dashFilters:{region:"",status:"",orderType:"",source:""},
  openCard:null,

var pollTimer=null;
function startPolling(){ stopPolling(); pollTimer=setInterval(function(){ refreshAll(true); }, 12000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function refreshAll(silent){
  if(!state.currentUser) return Promise.resolve();
  return apiCall("getAll", { caller: callerCred() }).then(function(data){
    state.users = data.users || [];
    state.requests = (data.requests || []).map(function(r){ r.createdAt = toMs(r.createdAt); r.updatedAt = toMs(r.updatedAt); return r; });
    var me = state.users.filter(function(u){ return u.username === state.currentUser.username; })[0];
    if(me) state.currentUser.role = me.role;
    // Background polling must never blow away a form the user is mid-typing in
    // (New Request fields, a password field, an ops remark, ...) — most of those
    // aren't driven by `state`, so a full re-render would silently clear them.
    // Skip painting this cycle; the data is already in `state` and will show on
    // the next render the user's own actions trigger, or the next poll once
    // they're no longer focused in a field.
    var active = document.activeElement;
    var isEditing = silent && active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    if(!isEditing) render();
  }).catch(function(e){ if(!silent) toast("Couldn't refresh: "+e.message); });
}

function authErrText(code){

/* ---------- request actions ---------- */
function fieldOf(el){ return el ? el.closest(".field") : null; }
function markField(el, bad){ var f = fieldOf(el); if(f) f.classList.toggle("invalid", !!bad); }
function clearInvalidFields(){ $all(".field.invalid").forEach(function(f){ f.classList.remove("invalid"); }); }
function findDuplicateRequest(lnVal, webVal){
  lnVal = (lnVal||"").toUpperCase(); webVal = (webVal||"").toUpperCase();
  return state.requests.filter(function(r){
    var rl = (r.lnOrder||"").toUpperCase(), rw = (r.webOrderNumber||"").toUpperCase();
    return (lnVal && rl===lnVal) || (webVal && rw && rw===webVal);
  })[0];
}

async function submitRequest(){
  clearInvalidFields();
  var ORDER_NO_RE = /^[A-Za-z0-9]{9}$/;
  var orderTypeEl=$("#orderTypeSel"), webEl=$("#webOrderNumberInput"), lnEl=$("#lnOrderInput"),
      mobileEl=$("#mobileInput"), regionEl=$("#regionSel"), amountEl=$("#amountInput"),
      reasonEl=$("#reasonSel"), sourceEl=$("#sourceSel"), scopeEl=$("#scopeSel"),
      itemsEl=$("#itemsInput"), noteEl=$("#noteInput"), refundEl=$("#refundMethodSel"), retainEl=$("#retainSel");

  var orderType = orderTypeEl.value;
  var firstBad = null;
  function fail(el){ markField(el, true); if(!firstBad) firstBad = el; }

  if(!orderType) fail(orderTypeEl);
  var webVal = webEl.value.trim(), lnVal = lnEl.value.trim();
  if(orderType==="Online"){
    if(!webVal) fail(webEl);
    else if(!ORDER_NO_RE.test(webVal)) fail(webEl);
  }
  if(!lnVal) fail(lnEl);
  else if(!ORDER_NO_RE.test(lnVal)) fail(lnEl);
  if(!mobileEl.value.trim()) fail(mobileEl);
  if(!regionEl.value) fail(regionEl);
  if(!amountEl.value || isNaN(parseFloat(amountEl.value))) fail(amountEl);
  if(!reasonEl.value) fail(reasonEl);
  if(!sourceEl.value) fail(sourceEl);
  if(!scopeEl.value) fail(scopeEl);
  if(scopeEl.value==="Specific Item(s)" && !itemsEl.value.trim()) fail(itemsEl);
  if(!noteEl.value.trim()) fail(noteEl);
  if(!refundEl.value) fail(refundEl);
  if(!retainEl.value) fail(retainEl);

  // Order-number prefix must belong to the same channel (Online/Store) as the selected Order Type.
  if(orderType && ORDER_NO_RE.test(lnVal)){
    var m1 = PREFIX_MAP[lnVal.slice(0,2).toUpperCase()];
    if(m1 && m1.every(function(x){ return x.type && x.type!==orderType; })) fail(lnEl);
  }
  if(orderType==="Online" && ORDER_NO_RE.test(webVal)){
    var m2 = PREFIX_MAP[webVal.slice(0,2).toUpperCase()];
    if(m2 && m2.every(function(x){ return x.type && x.type!=="Online"; })) fail(webEl);
  }

  // Block a second cancellation request against an order that already has one.
  var dup = (lnVal||webVal) ? findDuplicateRequest(lnVal, webVal) : null;
  if(dup){
    fail(lnEl);
    if(webVal) fail(webEl);
    toast("Order "+dup.id+" already has a cancellation request ("+(STATUS[dup.status]?STATUS[dup.status].label:dup.status)+").");
    lnEl.focus();
    return false;
  }

  if(firstBad){
    toast("Please fix the field(s) highlighted in red.");
    firstBad.focus();
    return false;
  }

  var data = {
    webOrderNumber: orderType==="Online" ? webVal : "",
    lnOrder: lnVal, mobile: mobileEl.value.trim(), orderType: orderType, region: regionEl.value,
    amount: parseFloat(amountEl.value), reason: reasonEl.value, note: noteEl.value.trim(),
    refundMethod: refundEl.value, retain: retainEl.value,
    source: sourceEl.value, scope: scopeEl.value, items: scopeEl.value==="Specific Item(s)" ? itemsEl.value.trim() : ""
  };
  try{
    var res = await apiCall("submitRequest", { caller: callerCred(), data: data });
    toast("Cancellation request "+res.id+" submitted.");
    await refreshAll(true);
    return true;
  }catch(e){ toast("Couldn't submit the request: "+e.message); return false; }
}
async function updateStatus(id, status, remark){
  var r = state.requests.filter(function(x){ return x.id===id; })[0];
  try{
    await apiCall("updateStatus", { caller: callerCred(), id:id, status:status, remark:remark||"" });
    toast("Status updated: "+STATUS[status].label);
    if(r) openStoreEmail(r, status, remark);
    await refreshAll(true);
  }catch(e){ toast("Couldn't update status: "+e.message); }
}

/* Builds a pre-filled email (subject + body) for the store and opens it in the
   user's default mail app (Outlook on most corporate Windows machines). */
/* Who the store-notification email goes to: the Online team for a "W" (web) order
   number prefix, otherwise the specific branch the prefix maps to. */
function recipientFor(r){
  var num = (r.lnOrder || r.webOrderNumber || "").toUpperCase();
  var prefix = num.slice(0,2);
  if(prefix.charAt(0)==="W") return "Online";
  var m = PREFIX_MAP[prefix];
  if(m && m.length) return m[0].branch;
  return "Store";
}
function buildMailto(r, status, remark){
  var recipient = recipientFor(r);
  var isWhole = r.scope !== "Specific Item(s)";
  var requestKind = isWhole ? "Order cancellation request" : "Item cancellation request";
  var subject = requestKind+" "+r.id+" — "+recipient;

  var lines = [];
  lines.push("Dear "+recipient+",");
  lines.push("");
  lines.push("Please find below "+(isWhole
    ? "an order cancellation request."
    : "a cancellation request for the following item(s): "+(r.items||"—")+"."));
  lines.push("");
  if(r.retain !== "Retained"){
    if(r.refundMethod === "Same Payment Method"){
      lines.push("Kindly process the refund to the same payment method used for this order.");
    } else if(r.refundMethod === "Credit Note"){
      lines.push("Kindly process this as a Credit Note.");
    }
    lines.push("");
  }
  lines.push("Order details:");
  lines.push("Web Order: "+(r.webOrderNumber||"N/A"));
  lines.push("LN Order: "+r.lnOrder);
  lines.push("Mobile: "+r.mobile);
  lines.push("Status: "+(CLOSED_STATUSES.indexOf(status)>-1 ? STATUS[status].label : (status==="pending"||status==="new") ? "Pending for Review" : "Email sent to "+recipient));
  lines.push("Date: "+fmtDate(r.createdAt));
  lines.push("Amount: "+fmtMoney(r.amount));
  lines.push("Refund Via: "+r.refundMethod);
  lines.push("Agent Name: "+r.agent);
  if(remark){ lines.push(""); lines.push("Remark: "+remark); }
  lines.push("");
  lines.push("Regards,");
  lines.push(state.currentUser.username);

  return "mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.join("\n"));
}
function openStoreEmail(r, status, remark){
  try{
    var a = document.createElement("a");
    a.href = buildMailto(r, status, remark);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){}
}

/* ---------- derived data ---------- */
function canAct(){ return state.currentUser && (state.currentUser.role==="operations" || state.currentUser.role==="admin"); }
function isAdmin(){ return state.currentUser && state.currentUser.role==="admin"; }
function scopedRequests(scope){
  var now=Date.now(), from=0, to=now+1;
  if(scope==="today") from = startOfDay(now);
  else if(scope==="month") from = startOfMonth(now);
  else if(scope==="custom"){
    from = state.dashRange.from ? new Date(state.dashRange.from+"T00:00:00").getTime() : 0;
    to = state.dashRange.to ? new Date(state.dashRange.to+"T23:59:59").getTime() : now+1;
  }
  var list = state.requests.filter(function(r){ return r.createdAt >= from && r.createdAt <= to; });
  var f = state.dashFilters;
  if(f.region) list = list.filter(function(r){ return r.region===f.region; });
  if(f.status) list = list.filter(function(r){ return (r.status==="pending"?"new":r.status)===f.status; });
  if(f.orderType) list = list.filter(function(r){ return r.orderType===f.orderType; });
  if(f.source) list = list.filter(function(r){ return r.source===f.source; });
  return list;
}
function filteredRequests(){
  var f = state.filters;
  return state.requests.slice().sort(function(a,b){ return b.createdAt - a.createdAt; }).filter(function(r){
    if(f.status && (r.status==="pending"?"new":r.status)!==f.status) return false;
    if(f.orderType && r.orderType!==f.orderType) return false;
    if(f.region && r.region!==f.region) return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var hay=[r.id,r.webOrderNumber,r.lnOrder,r.mobile,r.note,r.agent,r.items].join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}
function countBy(list, fn){ var m={}; list.forEach(function(r){ var k=fn(r); m[k]=(m[k]||0)+1; }); return m; }

/* ---------- global event delegation (bound once) ---------- */
function initGlobalEvents(){
  document.addEventListener("click", function(e){
    var t;
    if(t = e.target.closest("[data-theme-toggle]")){ toggleTheme(); return; }
    if(t = e.target.closest(".switcher button")){ state.authMode = t.dataset.mode; render(); return; }
    if(t = e.target.closest(".roletoggle label")){
      $all(".roletoggle label").forEach(function(l){ l.classList.remove("checked"); });
      t.classList.add("checked");
      return;
    }
    if(t = e.target.closest(".tab")){ state.route = t.dataset.route; render(); return; }
    if(t = e.target.closest(".scopebar button")){ state.dashScope = t.dataset.scope; render(); return; }
    if(t = e.target.closest("#exportBtn")){ exportCsv(); return; }
    if(t = e.target.closest("[data-reset]")){ adminResetPassword(t.dataset.reset); return; }
    if(t = e.target.closest("[data-mailto]")){
      var rec = state.requests.filter(function(x){ return x.id===t.dataset.mailto; })[0];
      if(rec) openStoreEmail(rec, rec.status, "");
      return;
    }
    if(t = e.target.closest("[data-etm]")){
      var srcId = t.dataset.etmSrc;
      var val = srcId ? ($("#"+srcId) ? $("#"+srcId).value.trim() : "") : (t.dataset.etmValue||"");
      openInETM(t.dataset.etm, val);
      return;
    }
    if(t = e.target.closest("[data-act]")){
      var id = t.dataset.id, act = t.dataset.act;
      var card = t.closest(".reqcard");
      var remark = card && card.querySelector(".opsRemark") ? card.querySelector(".opsRemark").value : "";
      updateStatus(id, act, remark);
      return;
    }
    if(t = e.target.closest("[data-toggle]")){
      if(e.target.closest("textarea,button")) return;
      state.openCard = (state.openCard === t.dataset.toggle) ? null : t.dataset.toggle;
      render();
      return;
    }
  });
  document.addEventListener("change", function(e){
    var t;
    if(t = e.target.closest(".roleSel")){ adminSetRole(t.dataset.u, t.value); return; }
  });
}

    var el = document.getElementById(activeId);

  }

function wireNewRequest(){
  var sel = $("#orderTypeSel");
  function syncWebOrder(){
    var isOnline = sel.value==="Online";
    $("#webOrderReq").textContent = isOnline ? "*" : "(not applicable for Store)";
    var field = $("#webOrderField");
    var input = field.querySelector("input");
    field.classList.toggle("na", !isOnline);
    if(!isOnline) input.value="";
  }
  sel.addEventListener("change", syncWebOrder);
  syncWebOrder();

  function branchName(entry){ return entry.branch+" — "+((REGIONS.filter(function(x){return x.code===entry.region;})[0]||{}).label||entry.region); }
  var regionSel = $("#regionSel");
  function syncCurrency(){ $("#amountCurrency").textContent = regionSel.value ? currencyFor(regionSel.value) : "select region"; }
  regionSel.addEventListener("change", syncCurrency);
  syncCurrency();
  function detectFromOrderNo(){
    var lnVal = (form.lnOrder.value||"").trim().toUpperCase();
    var webVal = (form.webOrderNumber.value||"").trim().toUpperCase();
    var prefix = (lnVal.length>=2 ? lnVal.slice(0,2) : (webVal.length>=2 ? webVal.slice(0,2) : ""));
    var hint = $("#regionHint"), regionEl = $("#regionSel");
    var matches = PREFIX_MAP[prefix];
    if(!matches){ hint.textContent=""; return; }
    if(matches.length===1){
      regionEl.value = matches[0].region;
      hint.textContent = "Detected: "+branchName(matches[0]);
      syncCurrency();
    } else {
      hint.textContent = "Prefix matches more than one branch — confirm the region: "+matches.map(branchName).join(" / ");
    }
  }
  function checkDuplicateOrderNo(){
    var lnVal = (form.lnOrder.value||"").trim().toUpperCase();
    var webVal = (form.webOrderNumber.value||"").trim().toUpperCase();
    var hint = $("#dupHint");
    var dup = (lnVal||webVal) ? findDuplicateRequest(lnVal, webVal) : null;
    if(dup){
      hint.textContent = "⚠ Already has a cancellation request: "+dup.id+" ("+(STATUS[dup.status]?STATUS[dup.status].label:dup.status)+")";
      hint.classList.add("warn");
    } else {
      hint.textContent = "";
      hint.classList.remove("warn");
    }
  }

  var form = $("#newReqForm");
  form.lnOrder.addEventListener("input", function(){ detectFromOrderNo(); checkDuplicateOrderNo(); });
  form.webOrderNumber.addEventListener("input", function(){ detectFromOrderNo(); checkDuplicateOrderNo(); });

  var scopeSel = $("#scopeSel");
  function syncScope(){
    var isItem = scopeSel.value==="Specific Item(s)";
    var field = $("#itemsField");
    field.hidden = !isItem;
    if(!isItem) field.querySelector("textarea").value="";
  }
  scopeSel.addEventListener("change", syncScope);
  syncScope();

  var dateEl = $("#dateInput");
  if(dateEl) dateEl.value = new Date().toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short",year:"numeric"});

  /* Optional CTI/CCS screen-pop integration: if your call center system can open this
     page with the caller's number (and region) as URL parameters — e.g.
     https://.../?mobile=0501234567&region=UAE — those fields are pre-filled automatically.

     Same mechanism also used by the ETM bulk-fetch console script's "Send to Cancel
     Desk" button (see etm-bulk-fetch.js): after it scrapes one order from ETM (same-origin,
     so it's allowed to read the page — ETM itself blocks any cross-origin embed/fetch of
     its data, which is why that script has to run inside ETM's own tab), it opens this page
     with ?order=&mobile=&amount=&items= already filled in, so the agent lands here with
     the whole form pre-filled instead of retyping anything. */
  try{
    var qp = new URLSearchParams(location.search);
    var mobileEl = $("#mobileInput"), regionEl = $("#regionSel"), amountEl = $("#amountInput");
    if(qp.get("mobile") && mobileEl) mobileEl.value = qp.get("mobile");
    if(qp.get("region") && regionEl){ regionEl.value = qp.get("region").toUpperCase(); syncCurrency(); }
    var orderQp = qp.get("order");
    if(orderQp){
      form.lnOrder.value = orderQp.trim().toUpperCase();
      detectFromOrderNo();
      checkDuplicateOrderNo();
    }
    if(qp.get("amount") && amountEl){ amountEl.value = qp.get("amount"); }
    if(qp.get("items")){
      scopeSel.value = "Specific Item(s)";
      syncScope();
      $("#itemsInput").value = qp.get("items");
    }
    if(orderQp || qp.get("mobile")) toast("Auto-filled from ETM — check the details then submit.");
  }catch(e){}

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var ok = await submitRequest();
    if(ok){ form.reset(); syncWebOrder(); syncScope(); syncCurrency(); clearInvalidFields(); checkDuplicateOrderNo(); $("#regionHint").textContent=""; }
  });
  // Clear the red highlight on a field the moment the agent starts fixing it.
  form.addEventListener("input", function(e){ markField(e.target, false); });
  form.addEventListener("change", function(e){ markField(e.target, false); });
}

function exportCsv(){
  var list = filteredRequests();
  var cols = ["id","createdAt","agent","orderType","webOrderNumber","lnOrder","mobile","region","amount","currency","amountAED","reason","source","scope","items","note","refundMethod","retain","status"];
  var head = cols.join(",");
  var rows = list.map(function(r){
    return cols.map(function(c){
      var v;
      if(c==="createdAt") v = fmtDate(r.createdAt);
      else if(c==="status") v = (STATUS[r.status]?STATUS[r.status].label:r.status);
      else if(c==="currency") v = currencyFor(r.region);
      else if(c==="amountAED") v = toAED(r.amount, r.region).toFixed(2);
      else v = (r[c]==null?"":r[c]);
      v = String(v).replace(/"/g,'""');
      return '"'+v+'"';
    }).join(",");
  });
  var csv = head+"\n"+rows.join("\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "pan-home-cancellations.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function renderDashboard(){
  var scope = state.dashScope;
  var list = scopedRequests(scope);
  var total = list.length;

  var closedList = list.filter(function(r){ return CLOSED_STATUSES.indexOf(r.status)>-1; });
  var openList = list.filter(function(r){ return CLOSED_STATUSES.indexOf(r.status)===-1; });
  var cancelledAmt = closedList.reduce(function(s,r){ return s+toAED(r.amount, r.region); },0);
  var pendingAmt = openList.reduce(function(s,r){ return s+toAED(r.amount, r.region); },0);
  var retained = list.filter(function(r){ return r.retain==="Retained"; }).length;
  var retRate = total? Math.round(retained/total*100) : 0;
  var closedRate = total? Math.round(closedList.length/total*100) : 0;

  var byReason = countBy(list, function(r){ return r.reason; });
  var byRegion = countBy(list, function(r){ return (REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label || r.region; });
  var byRegionAmt = {};
  list.forEach(function(r){ var k=(REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label||r.region; byRegionAmt[k]=(byRegionAmt[k]||0)+toAED(r.amount, r.region); });

    ) : '')+

        REGIONS.map(function(r){ return '<option value="'+r.code+'" '+(f.region===r.code?"selected":"")+'>'+r.code+'</option>'; }).join("")+'</select></div>'+
      '<div class="field" style="width:190px"><label>Status</label><select id="dfStatus"><option value="">All</option>'+

}
function scopeLabel(s){ return s==="today"?"today":(s==="month"?"this month":(s==="custom"?"the selected range":"all time")); }
function kpi(lbl,val,sub){ return '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val num">'+val+'</div><div class="sub">'+sub+'</div></div>'; }
function chartCard(title,inner){ return '<div class="card"><h2 style="font-size:14.5px">'+title+'</h2>'+inner+'</div>'; }
function toPairs(m){ return Object.keys(m).map(function(k){ return {label:k, value:m[k]}; }).sort(function(a,b){return b.value-a.value;}); }

function hbarList(m, limit, fmt){
  var pairs = toPairs(m).slice(0, limit||10);
  if(!pairs.length) return '<p class="sub">No data yet.</p>';
  var max = Math.max.apply(null, pairs.map(function(p){return p.value;}));
  return '<div class="hbarlist">'+ pairs.map(function(p){
    var pct = max? Math.max(4, Math.round(p.value/max*100)) : 0;
    return '<div class="hbarrow"><div class="lbl" title="'+esc(p.label)+'">'+esc(p.label)+'</div>'+
      '<div class="hbartrack"><div class="hbarfill" style="width:'+pct+'%"></div></div>'+
      '<div class="v num">'+(fmt?fmt(p.value):p.value)+'</div></div>';
  }).join("") +'</div>';
}

var FALLBACK_CATS = ["cat-1","cat-2","cat-3","cat-4","cat-5","cat-6"];
function colorForLabel(label, colorMap, fallbackIndex){
  if(colorMap && colorMap[label]) return "var(--"+colorMap[label]+")";
  return "var(--"+FALLBACK_CATS[fallbackIndex%FALLBACK_CATS.length]+")";
}
function donutSVG(pairs, colorMap){
  if(!pairs.length) return '<p class="sub">No data yet.</p>';
  var total = pairs.reduce(function(s,p){return s+p.value;},0);
  if(!total) return '<p class="sub">No data yet.</p>';
  var R=58, C=2*Math.PI*R, gap=3, circ="";
  var offset=0;
  pairs.forEach(function(p,i){
    var color = colorForLabel(p.label, colorMap, i);
    var frac = p.value/total;
    var len = Math.max(0, frac*C - gap);
    circ += '<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 90 90)"></circle>';
    offset += frac*C;
  });
  var legend = pairs.map(function(p,i){
    var color = colorForLabel(p.label, colorMap, i);
    var pct = Math.round(p.value/total*100);
    return '<div class="item"><span class="sw" style="background:'+color+'"></span>'+esc(p.label)+' <b>'+p.value+'</b> ('+pct+'%)</div>';
  }).join("");
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
    '<svg width="140" height="140" viewBox="0 0 180 180"><g>'+circ+'</g>'+
    '<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Manrope,sans-serif">'+total+'</text>'+
    '<text x="90" y="104" text-anchor="middle" font-size="11" fill="var(--ink-faint)">total</text>'+
    '</svg><div class="legend" style="margin-top:0;flex-direction:column;gap:7px">'+legend+'</div></div>';
}

function buildTrend(list, scope){
  var buckets = [];
  if(scope==="today"){
    for(var h=0;h<24;h++){ buckets.push({label:(h%6===0?pad2(h)+":00":""), key:h, value:0}); }
    list.forEach(function(r){ var h=new Date(r.createdAt).getHours(); buckets[h].value++; });
  } else if(scope==="month"){
    var days = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    for(var d=1; d<=days; d++){ buckets.push({label:(d%5===0||d===1?String(d):""), key:d, value:0}); }
    list.forEach(function(r){ var d=new Date(r.createdAt).getDate(); buckets[d-1].value++; });
  } else {
    var now=new Date();
    var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    for(var i=11;i>=0;i--){ var dt=new Date(now.getFullYear(), now.getMonth()-i, 1); buckets.push({label:names[dt.getMonth()], key:dt.getFullYear()+"-"+dt.getMonth(), value:0}); }
    var idx={}; buckets.forEach(function(b,i2){ idx[b.key]=i2; });
    list.forEach(function(r){ var dt=new Date(r.createdAt); var k=dt.getFullYear()+"-"+dt.getMonth(); if(idx[k]!=null) buckets[idx[k]].value++; });
  }
  return buckets;
}
function renderTrendSVG(buckets){
  if(!buckets.length) return '<p class="sub">No data yet.</p>';
  var max = Math.max(1, Math.max.apply(null, buckets.map(function(b){return b.value;})));
  var W=880, H=180, padL=6, padB=22, padT=10, n=buckets.length;
  var bw = (W-padL*2)/n;
  var bars = buckets.map(function(b,i){
    var h = Math.round((b.value/max) * (H-padB-padT));
    var x = padL + i*bw;
    var y = H-padB-h;
    var bwReal = Math.max(2, bw-2);
    return '<rect class="trbar" data-v="'+b.value+'" x="'+(x+1)+'" y="'+y+'" width="'+bwReal+'" height="'+Math.max(h,2)+'" rx="2" fill="var(--accent)" opacity="0.9"></rect>';
  }).join("");
  var labels = buckets.map(function(b,i){
    if(!b.label) return "";
    var x = padL + i*bw + bw/2;
    return '<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+esc(b.label)+'</text>';
  }).join("");
  return '<svg id="trendSvg" width="100%" viewBox="0 0 '+W+' '+H+'" style="overflow:visible;max-width:100%">'+
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padL)+'" y2="'+(H-padB)+'" stroke="var(--border)" stroke-width="1"></line>'+
    bars+labels+'</svg>';
}
function wireDashboard(){
  var svg = $("#trendSvg");
  if(svg){
    on(svg,"mousemove","rect.trbar",function(e,t){
      var tip=$("#tooltip");
      tip.textContent = t.dataset.v + " request"+(t.dataset.v==1?"":"s");
      tip.style.left=(e.clientX+10)+"px"; tip.style.top=(e.clientY-28)+"px"; tip.style.opacity=1;
    });
    svg.addEventListener("mouseleave", function(){ $("#tooltip").style.opacity=0; });
  }
  var from = $("#dashFrom"), to = $("#dashTo");
  if(from) from.addEventListener("change", function(){ state.dashRange.from=this.value; render(); });
  if(to) to.addEventListener("change", function(){ state.dashRange.to=this.value; render(); });
  var dfRegion=$("#dfRegion"), dfStatus=$("#dfStatus"), dfOrderType=$("#dfOrderType"), dfSource=$("#dfSource");
  if(dfRegion) dfRegion.addEventListener("change", function(){ state.dashFilters.region=this.value; render(); });
  if(dfStatus) dfStatus.addEventListener("change", function(){ state.dashFilters.status=this.value; render(); });
  if(dfOrderType) dfOrderType.addEventListener("change", function(){ state.dashFilters.orderType=this.value; render(); });
  if(dfSource) dfSource.addEventListener("change", function(){ state.dashFilters.source=this.value; render(); });
}

function renderTeam(){
  var rows = state.users.slice().sort(function(a,b){return a.username.localeCompare(b.username);}).map(function(u){
    var cnt = state.requests.filter(function(r){return r.agent===u.username;}).length;

      '<select class="roleSel" data-u="'+esc(u.username)+'">'+
        ["agent","operations","admin"].map(function(r){ return '<option value="'+r+'" '+(u.role===r?"selected":"")+'>'+r+'</option>'; }).join("")+
      '</select></td><td class="num">'+cnt+'</td><td><button class="btn sm" data-reset="'+esc(u.username)+'">Reset to 12345</button></td></tr>';
  }).join("");
  return '<div class="card"><h2>Team</h2><p class="sub">Manage roles and reset passwords.</p>'+
    '<div class="tablewrap"><table class="teamtbl"><thead><tr><th>Username</th><th>Role</th><th>Requests</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '</div>';
}
