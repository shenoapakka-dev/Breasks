<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan Home Cancel Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F6; --surface:#FFFFFF; --surface-2:#EEF2F2; --border:#DDE3E3;
  --ink:#16222A; --ink-muted:#5B6B72; --ink-faint:#8A96A0;
  --accent:#0D9488; --accent-ink:#FFFFFF; --accent-soft:#E3F3F1;
  --good:#16A34A; --good-soft:#E3F6E9; --warn:#B45309; --warn-soft:#FDF1DD; --info:#2563EB; --info-soft:#E6EDFC; --bad:#B91C1C; --bad-soft:#FBE4E4;
  --cat-1:#0D9488; --cat-2:#7C3AED; --cat-3:#C2410C; --cat-4:#0369A1; --cat-5:#A16207; --cat-6:#BE185D;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 8px 24px -12px rgba(20,30,30,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171A; --surface:#182124; --surface-2:#1E2A2D; --border:#2B3A3D;
    --ink:#EAF1F1; --ink-muted:#A7B6B8; --ink-faint:#71848A;
    --accent:#14B8A6; --accent-ink:#06211E; --accent-soft:#19302C;
    --good:#4ADE80; --good-soft:#163424; --warn:#F5A524; --warn-soft:#3A2A10; --info:#60A5FA; --info-soft:#17263E; --bad:#F87171; --bad-soft:#3A1A1A;
    --cat-1:#0D9488; --cat-2:#9061F9; --cat-3:#EA580C; --cat-4:#0284C7; --cat-5:#A16207; --cat-6:#DB2777;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171A; --surface:#182124; --surface-2:#1E2A2D; --border:#2B3A3D;
  --ink:#EAF1F1; --ink-muted:#A7B6B8; --ink-faint:#71848A;
  --accent:#14B8A6; --accent-ink:#06211E; --accent-soft:#19302C;
  --good:#4ADE80; --good-soft:#163424; --warn:#F5A524; --warn-soft:#3A2A10; --info:#60A5FA; --info-soft:#17263E; --bad:#F87171; --bad-soft:#3A1A1A;
  --cat-1:#0D9488; --cat-2:#9061F9; --cat-3:#EA580C; --cat-4:#0284C7; --cat-5:#A16207; --cat-6:#DB2777;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3,.brand{font-family:"Manrope",-apple-system,Segoe UI,sans-serif}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit}
::selection{background:var(--accent-soft)}
img{max-width:100%}
[hidden]{display:none!important}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 0;background:var(--surface);border-bottom:1px solid var(--border);margin:0 -16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;min-width:0}
.tab{padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.active{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:1px solid var(--border)}
.rolepill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-muted)}
.linkbtn{background:none;border:none;color:var(--ink-muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.linkbtn:hover{color:var(--ink)}

main{max-width:none;width:100%;margin:0;padding:20px 0 60px}
.view{display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--ink-muted);font-size:13px;margin:0 0 14px}

label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:5px;letter-spacing:.01em}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);
  font-size:14px;font-family:inherit;min-width:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:0;min-width:0}
.field .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;min-height:0}
.field .hint.warn{color:var(--bad);font-weight:600}
.field.invalid label{color:var(--bad)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.field .err{font-size:11.5px;color:var(--bad);margin-top:4px;min-height:0}
.field.na input,.field.na select{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.cols2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.grid,.grid.cols2{grid-template-columns:1fr}}

.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.approved{background:var(--good-soft);color:var(--good)}
.badge.sent{background:var(--info-soft);color:var(--info)}
.badge.closed{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.store{background:var(--surface-2);color:var(--ink-muted)}
.badge.online{background:var(--accent-soft);color:var(--accent)}
.badge.retained{background:var(--good-soft);color:var(--good)}
.badge.notretained{background:var(--bad-soft);color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-family:"Manrope",sans-serif}
.kpi .sub{font-size:12px;color:var(--ink-faint);margin-top:2px}

.scopebar{display:flex;gap:6px;background:var(--surface-2);padding:3px;border-radius:9px;width:max-content}
.scopebar button{border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer}
.scopebar button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chartgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:900px){.chartgrid{grid-template-columns:1fr}}
.newreq-layout{display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.newreq-layout{grid-template-columns:1fr}}
.hbarlist{display:flex;flex-direction:column;gap:9px}
.hbarrow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;min-width:0}
.hbarrow .lbl{font-size:12.5px;color:var(--ink-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbartrack{background:var(--surface-2);border-radius:5px;height:10px;overflow:hidden;min-width:0}
.hbarfill{height:100%;border-radius:5px;background:var(--accent)}
.hbarrow .v{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hbarrow[data-chart-filter]:hover .lbl{color:var(--ink);text-decoration:underline}
.hbarrow.active .lbl{color:var(--accent);font-weight:700}
.hbarrow.active .hbarfill{background:var(--accent)}
.regionlegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.regionlegend-item{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:9px;padding:7px 11px;font-size:12px}
.regionlegend-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.regionlegend-item .rl-name{font-weight:700;color:var(--ink)}
.regionlegend-item .rl-count{color:var(--ink-muted)}
.regionlegend-item .rl-amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px}
.legend .item{display:flex;align-items:center;gap:6px;color:var(--ink-muted)}
.legend .item[data-chart-filter]:hover{text-decoration:underline;color:var(--ink)}
.legend .item.active{color:var(--accent);font-weight:700}
.legend .item.active .sw{outline:2px solid var(--accent);outline-offset:1px}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;z-index:100;opacity:0;transition:opacity .08s;white-space:nowrap;box-shadow:var(--shadow)}

.reqlist{display:flex;flex-direction:column;gap:10px}
.reqcard{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.reqlist .reqcard:nth-child(even){background:var(--surface-2)}
.reqhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.reqhead .id{font-weight:800;font-size:13px;font-family:"Manrope",sans-serif}
.reqhead .meta{color:var(--ink-faint);font-size:12px}
.reqhead .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.reqhead .chev{color:var(--ink-faint);transition:transform .15s}
.reqsummary{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 14px 12px;font-size:12px;color:var(--ink-muted);cursor:pointer;align-items:center}
.reqsummary span{white-space:nowrap}
.reqcard.open .chev{transform:rotate(90deg)}
.reqbody{border-top:1px solid var(--border);padding:14px;display:none}
.reqcard.open .reqbody{display:block}
.stepper{display:flex;align-items:flex-start;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.stepper .step{display:flex;flex-direction:column;align-items:center;min-width:108px;text-align:center}
.stepper .step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid var(--border);background:var(--surface-2);color:var(--ink-faint);flex:none}
.stepper .step.done .step-dot{background:var(--good);border-color:var(--good);color:#fff}
.stepper .step.current .step-dot{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.stepper .step-label{font-size:11px;font-weight:700;margin-top:6px;color:var(--ink)}
.stepper .step.upcoming .step-label{color:var(--ink-faint)}
.stepper .step-meta{font-size:10px;color:var(--ink-faint);margin-top:2px}
.stepper .step-line{flex:1;height:2px;background:var(--border);margin-top:12px;min-width:16px}
.stepper .step-line.done{background:var(--good)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12.5px;margin-bottom:12px}
@media (max-width:760px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv .k{color:var(--ink-faint);text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.kv .vv{margin-top:2px;font-weight:600}
.note-box{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;white-space:pre-wrap}
.history{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.hrow{display:flex;gap:8px;font-size:12px;color:var(--ink-muted)}
.hrow .t{color:var(--ink-faint);white-space:nowrap}
.opsbox{background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:4px}
.opsbox label{color:var(--ink-muted)}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filterbar .field{width:160px}
.filterbar .field.grow{flex:1;min-width:180px}

.empty{text-align:center;padding:44px 20px;color:var(--ink-muted)}
.empty .big{font-size:34px;margin-bottom:8px}

.loginwrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.loginbox{width:100%;max-width:380px}
.loginbox .brand{justify-content:center;font-size:20px;margin-bottom:4px}
.loginbox .tag{text-align:center;color:var(--ink-muted);font-size:13px;margin-bottom:22px}
.roletoggle{display:flex;gap:8px}
.roletoggle label{flex:1;border:1px solid var(--border);border-radius:9px;padding:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-muted);margin:0}
.roletoggle input{display:none}
.roletoggle label.checked{border-color:var(--accent);background:var(--accent-soft)}
.formerr{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;bottom:max(18px, env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

table.teamtbl{width:100%;border-collapse:collapse;font-size:13px}
table.teamtbl th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border)}
table.teamtbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tablewrap{overflow-x:auto}

/* ---- Follow-up & Reminders ---- */
.kpi.fu-kpi{cursor:pointer;transition:box-shadow .1s}
.kpi.fu-kpi.active{box-shadow:0 0 0 2px var(--accent) inset, var(--shadow)}
.fu-scopebar{display:flex;gap:6px;background:var(--surface-2);padding:3px;border-radius:9px;width:max-content;flex-wrap:wrap}
.fu-scopebar button{border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer}
.fu-scopebar button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fu-popup{position:fixed;top:max(16px, env(safe-area-inset-top,0px));right:16px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;z-index:150}
.fu-popup h3{margin:0 0 4px;font-size:14px}
.fu-popup .sub{margin:0 0 10px}
.fu-popup .btnrow{gap:6px}
.fu-chat-btn{position:fixed;bottom:max(18px, env(safe-area-inset-bottom,0px));right:18px;z-index:140;border-radius:999px;padding:10px 16px;box-shadow:var(--shadow)}
.fu-chat-badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}
.fu-chat-panel{position:fixed;bottom:70px;right:18px;width:300px;max-height:420px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:140;overflow:hidden}
.fu-chat-panel .hd{padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fu-chat-panel .msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.fu-chat-panel .msg{max-width:85%;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.fu-chat-panel .msg.me{align-self:flex-end;background:var(--accent-soft);color:var(--accent)}
.fu-chat-panel .ft{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
.fu-chat-panel .ft input{flex:1}
@media (max-width:480px){.fu-chat-panel{width:calc(100vw - 32px);right:16px}}
</style>

<script>
(function(){
"use strict";

/* ========================================================================
   CONFIG — fill in API_URL after deploying the Apps Script Web App.
   ======================================================================== */
var API_URL = "https://script.google.com/macros/s/AKfycbzrD3Arlt2B-CzpIMgv9Npplm_m7AIDGoTRd_ZOpCX5YztpVZV0Zlqqm0Rc9pgQ5j5-fg/exec";
var API_KEY = "daQs4oFH4psq9jc9p8d669jFtm1Q7tBq";

/* ---------- constants ---------- */
var REASONS = [
  "Change of Mind","Found a Better Price Elsewhere","Delivery Delay / Long Lead Time",
  "Item Out of Stock / Discontinued","Wrong Item Ordered","Wrong Size / Does Not Fit Space",
  "Duplicate Order","Found a Better Design / Alternative","Product Quality Concern (Reviews/Photos)",
  "Payment Failed / Payment Issue","Can No Longer Afford the Item","Relocating / Moving Plans Changed",
  "Assembly / Installation Concerns","Ordered by Mistake","Prefers Exchange Instead of Cancellation",
  "Delivery Address Problem","Suspected Fraudulent Order","Other (Specify in Notes)"
];
var REGIONS = [
  {code:"UAE",label:"United Arab Emirates"},
  {code:"KSA",label:"Saudi Arabia"},
  {code:"QAT",label:"Qatar"},
  {code:"OMN",label:"Oman"}
];
/* Each region's native currency, and its approximate fixed AED equivalent (GCC
   currencies are pegged to USD, so these are stable, not live FX rates). Amount
   is always entered and shown in the order's own currency; dashboard totals are
   converted to AED so they can be summed across regions. */
var CURRENCY_BY_REGION = {UAE:"AED", KSA:"SAR", QAT:"QAR", OMN:"OMR"};
var AED_PER_UNIT = {AED:1, SAR:0.9793, QAR:1.0091, OMR:9.5514};
function currencyFor(region){ return CURRENCY_BY_REGION[region] || "AED"; }
/* ETM is the internal order system; there's no documented deep-link parameter for
   opening one exact order, so this copies the order number to the clipboard and
   opens ETM's own search page (already logged in for the agent) to paste into. */
var ETM_URLS = {
  web: "https://etm.panemirates.ae/ordering/floor/order-search-web",
  ln:  "https://etm.panemirates.ae/ordering/floor/order-search"
};
function openInETM(kind, value){
  if(value){
    try{ navigator.clipboard && navigator.clipboard.writeText(value); toast("Copied "+value+" — paste it into ETM's search."); }
    catch(e){ toast("Opening ETM — paste "+value+" into the search."); }
  }
  window.open(ETM_URLS[kind]||ETM_URLS.ln, "_blank");
}
function toAED(amount, region){ return (Number(amount)||0) * (AED_PER_UNIT[currencyFor(region)]||1); }
function fmtCurrency(amount, region){ return currencyFor(region)+" "+fmtMoney(amount); }
/* Order-number prefix -> branch/region lookup (first 2 letters of the order number).
   Some prefixes are shared across countries (OS, SS) — ambiguous prefixes list every
   match instead of guessing, and the agent picks the right one. */
var PREFIX_MAP = {
  // "W" + region letter = the LN/internal order number for an Online order
  // (e.g. WU... for UAE). U/K/Q/O + A or E = that region's own Web Order Number
  // prefix (e.g. UE.../UA... for UAE) — both forms are Online, just two different
  // identifiers ETM shows for the very same online transaction.
  WU:[{region:"UAE",branch:"UAE Online",type:"Online"}], BS:[{region:"UAE",branch:"Barsha Store",type:"Store"}],
  TS:[{region:"UAE",branch:"Zahia Store",type:"Store"}], YS:[{region:"UAE",branch:"Marina Store",type:"Store"}],
  CS:[{region:"UAE",branch:"DFC Mall Store",type:"Store"}], IS:[{region:"UAE",branch:"Deerfields Mall Store",type:"Store"}],
  VS:[{region:"UAE",branch:"Festival Plaza Store",type:"Store"}], JS:[{region:"UAE",branch:"FJR Store",type:"Store"}],
  NS:[{region:"UAE",branch:"Al Ain Store",type:"Store"}],
  UE:[{region:"UAE",branch:"UAE Online (Web Order #)",type:"Online"}], UA:[{region:"UAE",branch:"UAE Online (Web Order #)",type:"Online"}],
  WK:[{region:"KSA",branch:"KSA Online",type:"Online"}], RS:[{region:"KSA",branch:"Riyadh Store",type:"Store"}],
  KA:[{region:"KSA",branch:"KSA Online (Web Order #)",type:"Online"}], KE:[{region:"KSA",branch:"KSA Online (Web Order #)",type:"Online"}],
  WO:[{region:"OMN",branch:"Oman Online",type:"Online"}], GS:[{region:"OMN",branch:"Ghoubrah Store",type:"Store"}],
  OA:[{region:"OMN",branch:"Oman Online (Web Order #)",type:"Online"}], OE:[{region:"OMN",branch:"Oman Online (Web Order #)",type:"Online"}],
  WQ:[{region:"QAT",branch:"Qatar Online",type:"Online"}], LS:[{region:"QAT",branch:"Salwa Store",type:"Store"}],
  ES:[{region:"QAT",branch:"QDFC Mall Store",type:"Store"}],
  QA:[{region:"QAT",branch:"Qatar Online (Web Order #)",type:"Online"}], QE:[{region:"QAT",branch:"Qatar Online (Web Order #)",type:"Online"}],
  SS:[{region:"UAE",branch:"Sharjah Store",type:"Store"},{region:"OMN",branch:"Salalah Store",type:"Store"}],
  OS:[{region:"KSA",branch:"Olaya Store",type:"Store"},{region:"OMN",branch:"Alhail Store",type:"Store"}]
};
var SOURCES = ["Call Center","Care Email","Store"];
var SCOPES = ["Whole Order","Specific Item(s)"];
var REFUND_METHODS = ["Same Payment Method","Credit Note","Cash on Delivery"];
// Display label only — the stored value stays "Cash on Delivery" everywhere
// (data, finalStatusFor, etc.); this just makes clear to a reader that COD
// means nothing was paid online, so there is nothing to refund.
function refundLabel(v){ return v==="Cash on Delivery" ? "Cash on Delivery - No Refund" : v; }
var RETAIN_OPTIONS = ["Retained","Not Retained"];
/* Workflow: new -> an intermediate/final "sent" stage (auto-picked from order
   type + refund method — no manual choice) -> for Online, a separate
   Cancelled/Not Cancelled confirmation once the online team has actually
   processed it; for Store, sending it IS the close — there's no further
   confirmation step, since the store's own processing isn't tracked here.
   New can also go to "rejected" instead, sending the request back to the agent.
   "pending" / "approved" / "sent" are kept as aliases/legacy statuses for
   requests raised before this workflow was split out. */
var STATUS = {
  new:      {label:"New", cls:"pending"},
  pending:  {label:"New", cls:"pending"},
  rejected: {label:"Rejected — Returned to Agent", cls:"bad"},
  approved: {label:"Approved & Sent to the Store", cls:"sent"},
  sent:     {label:"Sent to the Store", cls:"sent"},
  sent_store_refund: {label:"Sent To the Store For Cancellation & Refund", cls:"closed"},
  sent_store_credit: {label:"Sent To the Store For Cancellation & Keep Credit Note", cls:"closed"},
  sent_online: {label:"Sent to Online Team", cls:"sent"},
  cancelled_refund: {label:"Cancelled with Refund Same Payment Method", cls:"closed"},
  cancelled_credit: {label:"Cancelled With Credit Note", cls:"closed"},
  cancelled_cdf:    {label:"Cancelled CDF", cls:"closed"},
  not_cancelled:    {label:"Not Cancelled (Technical Issue)", cls:"bad"}
};
var OPEN_STATUSES = ["new","pending","approved","sent","sent_online"];
var CLOSED_STATUSES = ["cancelled_refund","cancelled_credit","cancelled_cdf","sent_store_refund","sent_store_credit"];
var REJECTED_STATUSES = ["rejected"];
var NOT_CANCELLED_STATUSES = ["not_cancelled"];
// The one manual choice Operations makes from New is Reject; which "sent"
// stage to use otherwise is fully automatic from order type + refund method —
// Cash on Delivery needs no store/online-team step at all (nothing to collect
// or refund), so it jumps straight to the Confirm Cancelled action. For a
// Store order, the returned stage IS the final one (see CLOSED_STATUSES).
function nextSendStage(orderType, refundMethod){
  if(refundMethod==="Cash on Delivery") return null;
  if(orderType==="Online") return "sent_online";
  if(refundMethod==="Credit Note") return "sent_store_credit";
  return "sent_store_refund";
}
function finalStatusFor(refundMethod){
  if(refundMethod==="Credit Note") return "cancelled_credit";
  if(refundMethod==="Cash on Delivery") return "cancelled_cdf";
  return "cancelled_refund";
}
// Reverse of finalStatusFor — the actual Cancelled status is the source of
// truth for what really happened (it can be corrected later via the stage
// dropdown), so anything describing the outcome (the email) should read the
// refund method off the status being emailed, not the possibly-stale stored
// field, in case a request was closed one way and later corrected to another.
function refundMethodForStatus(status){
  if(status==="cancelled_credit" || status==="sent_store_credit") return "Credit Note";
  if(status==="cancelled_cdf") return "Cash on Delivery";
  if(status==="cancelled_refund" || status==="sent_store_refund") return "Same Payment Method";
  return null;
}

function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(root,evt,sel,fn){ root.addEventListener(evt,function(e){ var t=e.target.closest(sel); if(t && root.contains(t)) fn(e,t); }); }
function pad2(n){ return n<10?"0"+n:""+n; }
function fmtDate(ts){ if(!ts) return "—"; var d=new Date(ts); if(isNaN(d.getTime())) return String(ts); return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }

/* ---------- API client (Google Apps Script backend, no login required to call) ---------- */
function apiCall(action, payload){
  var body = Object.assign({ action: action, key: API_KEY }, payload||{});
  return fetch(API_URL, { method:"POST", body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error((j&&j.error)||"request_failed"); return j.data; });
}
function callerCred(){ return state.currentUser ? { username: state.currentUser.username, password: state.currentUser.password } : null; }

/* ---------- state ---------- */
var state = {
  currentUser:null,
  users:[],
  requests:[],
  route:"new",
  dashScope:"month",
  dashRange:{from:"",to:""},
  dashFilters:{region:"",status:"",orderType:"",source:"",agent:"",reason:""},
  openCard:null,
  filters:{ q:"", status:"", orderType:"", region:"", agent:"" },
  fu: null // set below once fuInitialState() is defined (function declarations are hoisted, so this is fine)
};
state.fu = fuInitialState();
var pollTimer=null;
function startPolling(){ stopPolling(); pollTimer=setInterval(function(){ refreshAll(true); }, 12000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function refreshAll(silent){
  if(!state.currentUser) return Promise.resolve();
  return apiCall("getAll", { caller: callerCred() }).then(function(data){
    state.users = data.users || [];
    state.requests = (data.requests || []).map(function(r){ r.createdAt = toMs(r.createdAt); r.updatedAt = toMs(r.updatedAt); return r; });
    var me = state.users.filter(function(u){ return u.username === state.currentUser.username; })[0];
    if(me) state.currentUser.role = me.role;
    // Background polling must never blow away a form the user is mid-typing in
    // (New Request fields, a password field, an ops remark, ...) — most of those
    // aren't driven by `state`, so a full re-render would silently clear them.
    // Skip painting this cycle; the data is already in `state` and will show on
    // the next render the user's own actions trigger, or the next poll once
    // they're no longer focused in a field.
    var active = document.activeElement;
    var isEditing = silent && active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    // The New Request form also holds state that lives outside `state` entirely
    // (parsed ETM data, the item-cancellation picker's selections/quantities) —
    // a repaint would silently discard that even when no field happens to be
    // focused, e.g. right after "Auto-fill from paste" or while just reviewing
    // before submitting. Nothing on that page needs a live repaint anyway (it's
    // a write-only form), so skip it entirely while it's open.
    var isFormRoute = silent && state.route==="new";
    if(!isEditing && !isFormRoute) render();
    // Follow-up reminders/chat live in their own overlay roots outside #app
    // (see renderOverlays()), so polling them can never wipe an in-progress
    // form the way a full render() of #app could — safe to do unconditionally
    // on every poll tick, regardless of which tab is open or what's mid-edit.
    fuPollReminders();
    fuPollChatUnread();
    // The Follow-up list/KPI data itself DOES repaint #app, so — exactly like
    // the New Request form above — skip it while the New Follow-up form or an
    // Open Case detail view (both hold DOM-only drafts) is on screen.
    if(state.route==="followup" && state.fu.view==="list") fuFetchDataDebounced();
  }).catch(function(e){ if(!silent) toast("Couldn't refresh: "+e.message); });
}

/* ---------- request actions ---------- */
function fieldOf(el){ return el ? el.closest(".field") : null; }
function markField(el, bad){ var f = fieldOf(el); if(f) f.classList.toggle("invalid", !!bad); }
function clearInvalidFields(){ $all(".field.invalid").forEach(function(f){ f.classList.remove("invalid"); }); }
// Blocking duplicate: an existing request for the same order that isn't
// rejected. A rejected one must NOT block resubmission — the agent is meant
// to raise a fresh request once the issue that caused the rejection is fixed.
function findDuplicateRequest(lnVal, webVal){
  lnVal = (lnVal||"").toUpperCase(); webVal = (webVal||"").toUpperCase();
  return state.requests.filter(function(r){
    var rl = (r.lnOrder||"").toUpperCase(), rw = (r.webOrderNumber||"").toUpperCase();
    var matches = (lnVal && rl===lnVal) || (webVal && rw && rw===webVal);
    return matches && r.status!=="rejected";
  })[0];
}
// Informational only — surfaced as a dismissible warning, never blocks submit.
function findRejectedMatch(lnVal, webVal){
  lnVal = (lnVal||"").toUpperCase(); webVal = (webVal||"").toUpperCase();
  return state.requests.filter(function(r){
    var rl = (r.lnOrder||"").toUpperCase(), rw = (r.webOrderNumber||"").toUpperCase();
    var matches = (lnVal && rl===lnVal) || (webVal && rw && rw===webVal);
    return matches && r.status==="rejected";
  })[0];
}

/* Parses the plain text an agent copy-pastes straight off an ETM order-details page
   (both the LN "Order Search" and the "Order Search WEB" layouts use the same
   label-then-value-on-next-line shape, and both header lines read
   "Order ( <LN order no> ) Details" even when the search box held the web order
   number instead — that's how we tell the two numbers apart). */
function parseEtmPaste(raw){
  var text = String(raw||"").replace(/\r\n/g, "\n");
  var splitAt = text.search(/Line\s*\t?Item\s*\t?Description/i);
  var head = splitAt>=0 ? text.slice(0, splitAt) : text;
  var itemsText = splitAt>=0 ? text.slice(splitAt) : "";

  function field(label){
    var re = new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*\\n+\\s*([^\\n]+)", "i");
    var m = head.match(re);
    return m ? m[1].trim() : "";
  }

  var lnMatch = head.match(/Order\s*\(\s*([A-Za-z0-9]{6,12})\s*\)\s*Details/i);
  var lnOrder = lnMatch ? lnMatch[1].toUpperCase() : "";

  // ETM's own delivery/fulfillment type code (e.g. "DFX" = Delivery and
  // Fixing, "CDF" = COD Delivery and Fixing) shown right after "Details" —
  // informational only, kept for reference, not used in any of our logic.
  var segMatch = head.match(/Order\s*\([^)]*\)\s*Details\s*\|\s*([A-Za-z]{2,5})\b/i);
  var orderSegment = segMatch ? segMatch[1].toUpperCase() : "";

  var webOrderNumber = "";
  head.split("\n").map(function(l){ return l.trim(); }).some(function(t){
    if(/^[A-Za-z0-9]{9}$/.test(t) && t.toUpperCase()!==lnOrder){ webOrderNumber = t.toUpperCase(); return true; }
    return false;
  });

  var mobile = field("Mobile").split("|")[0].trim();
  var totalRaw = field("Total").replace(/[^\d.]/g,"");
  var total = totalRaw!=="" ? parseFloat(totalRaw) : null;
  var paidRaw = field("Paid Amount").replace(/[^\d.]/g,"");
  var paid = paidRaw!=="" ? parseFloat(paidRaw) : null;

  var customerCode = "", customerName = "";
  var custMatch = field("Customer").match(/^(CU\d+)\s*\|\s*(.+?)\s*-?\s*$/i);
  if(custMatch){ customerCode = custMatch[1].toUpperCase(); customerName = custMatch[2].trim(); }

  var items = [];
  if(itemsText){
    itemsText.split("\n").slice(1).forEach(function(row){
      var c = row.split("\t").map(function(x){ return x.trim(); });
      if(c.length<9) return;
      var code = c[1], desc = c[2], qty = parseFloat(c[4])||0, lineTotal = parseFloat(c[8])||0;
      if(!code || !qty) return;
      // Keep every column ETM itself shows (same order: Line/Item/Description/
      // WH/Ordered/Delivered/BO/Price/Total), not just what we compute from it.
      items.push({
        line:c[0], code:code, desc:desc, wh:c[3], qty:qty, delivered:c[5], bo:c[6],
        price:parseFloat(c[7])||0, lineTotal:lineTotal, unitPrice: qty ? lineTotal/qty : lineTotal
      });
    });
  }

  return { lnOrder:lnOrder, webOrderNumber:webOrderNumber, mobile:mobile, total:total, paid:paid, items:items, customerCode:customerCode, customerName:customerName, orderSegment:orderSegment };
}

async function submitRequest(){
  clearInvalidFields();
  var ORDER_NO_RE = /^[A-Za-z0-9]{9}$/;
  var orderTypeEl=$("#orderTypeSel"), webEl=$("#webOrderNumberInput"), lnEl=$("#lnOrderInput"),
      mobileEl=$("#mobileInput"), regionEl=$("#regionSel"), amountEl=$("#amountInput"),
      reasonEl=$("#reasonSel"), sourceEl=$("#sourceSel"), scopeEl=$("#scopeSel"),
      itemsEl=$("#itemsInput"), noteEl=$("#noteInput"), refundEl=$("#refundMethodSel"), retainEl=$("#retainSel");

  var orderType = orderTypeEl.value;
  var firstBad = null;
  function fail(el){ markField(el, true); if(!firstBad) firstBad = el; }

  if(!orderType) fail(orderTypeEl);
  var webVal = webEl.value.trim(), lnVal = lnEl.value.trim();
  if(orderType==="Online"){
    if(!webVal) fail(webEl);
    else if(!ORDER_NO_RE.test(webVal)) fail(webEl);
    else if(!/^[UKQO]/i.test(webVal)) fail(webEl);
  }
  if(!lnVal) fail(lnEl);
  else if(!ORDER_NO_RE.test(lnVal)) fail(lnEl);
  if(!mobileEl.value.trim()) fail(mobileEl);
  if(!regionEl.value) fail(regionEl);
  if(!amountEl.value || isNaN(parseFloat(amountEl.value))) fail(amountEl);
  if(!reasonEl.value) fail(reasonEl);
  if(!sourceEl.value) fail(sourceEl);
  if(!scopeEl.value) fail(scopeEl);
  if(scopeEl.value==="Specific Item(s)" && !itemsEl.value.trim()) fail(itemsEl);
  if(!noteEl.value.trim()) fail(noteEl);
  if(!refundEl.value) fail(refundEl);
  if(!retainEl.value) fail(retainEl);

  // Order-number prefix must belong to the same channel (Online/Store) as the selected Order Type.
  if(orderType && ORDER_NO_RE.test(lnVal)){
    var m1 = PREFIX_MAP[lnVal.slice(0,2).toUpperCase()];
    if(m1 && m1.every(function(x){ return x.type && x.type!==orderType; })) fail(lnEl);
  }
  if(orderType==="Online" && ORDER_NO_RE.test(webVal)){
    var m2 = PREFIX_MAP[webVal.slice(0,2).toUpperCase()];
    if(m2 && m2.every(function(x){ return x.type && x.type!=="Online"; })) fail(webEl);
  }

  // Block a second cancellation request against an order that already has one.
  var dup = (lnVal||webVal) ? findDuplicateRequest(lnVal, webVal) : null;
  if(dup){
    fail(lnEl);
    if(webVal) fail(webEl);
    toast("Order "+dup.id+" already has a cancellation request ("+(STATUS[dup.status]?STATUS[dup.status].label:dup.status)+").");
    lnEl.focus();
    return false;
  }

  if(firstBad){
    toast("Please fix the field(s) highlighted in red.");
    firstBad.focus();
    return false;
  }

  var data = {
    webOrderNumber: orderType==="Online" ? webVal : "",
    lnOrder: lnVal, mobile: mobileEl.value.trim(), orderType: orderType, region: regionEl.value,
    amount: parseFloat(amountEl.value), reason: reasonEl.value, note: noteEl.value.trim(),
    refundMethod: refundEl.value, retain: retainEl.value,
    source: sourceEl.value, scope: scopeEl.value, items: scopeEl.value==="Specific Item(s)" ? itemsEl.value.trim() : "",
    customerCode: ($("#customerCodeInput")||{}).value || "", customerName: ($("#customerNameInput")||{}).value || "",
    orderSegment: ($("#orderSegmentInput")||{}).value || ""
  };
  try{
    var res = await apiCall("submitRequest", { caller: callerCred(), data: data });
    toast("Cancellation request "+res.id+" submitted.");
    await refreshAll(true);
    return true;
  }catch(e){ toast("Couldn't submit the request: "+e.message); return false; }
}
async function updateStatus(id, status, remark){
  var r = state.requests.filter(function(x){ return x.id===id; })[0];
  try{
    await apiCall("updateStatus", { caller: callerCred(), id:id, status:status, remark:remark||"" });
    toast("Status updated: "+STATUS[status].label);
    // Only the final resolution triggers the store/online-team email automatically —
    // intermediate "sent" stages and a reject don't email anyone on their own;
    // use "Email the Store" manually for those if needed.
    if(r && CLOSED_STATUSES.indexOf(status)>-1) openStoreEmail(r, status, remark);
    await refreshAll(true);
  }catch(e){ toast("Couldn't update status: "+e.message); }
}
// Open to any logged-in user on a closed/cancelled request — appends a
// timestamped, named entry to the history log without changing the status
// (stage changes themselves stay restricted — see canUpdateStage()).
async function addNote(id, note){
  note = (note||"").trim();
  if(!note){ toast("Write a note first."); return; }

/* Builds a pre-filled email (subject + body) for the store and opens it in the
   user's default mail app (Outlook on most corporate Windows machines). */
/* Who the store-notification email goes to: the Online team for a "W" (web) order
   number prefix, otherwise the specific branch the prefix maps to. */
function recipientFor(r){
  var num = (r.lnOrder || r.webOrderNumber || "").toUpperCase();
  var prefix = num.slice(0,2);
  if(prefix.charAt(0)==="W") return "Online";
  var m = PREFIX_MAP[prefix];
  if(m && m.length) return m[0].branch;
  return "Store";
}
function buildEmailParts(r, status, remark){
  var recipient = recipientFor(r);
  var isWhole = r.scope !== "Specific Item(s)";
  var requestKind = isWhole ? "Order cancellation request" : "Item cancellation request";
  var subject = requestKind+" "+r.lnOrder+" — "+recipient;

  var isFinal = CLOSED_STATUSES.indexOf(status)>-1;
  // Use the status actually being emailed as the source of truth for the
  // refund outcome — it may have been corrected via the stage dropdown
  // after the request was first closed, which wouldn't be reflected by the
  // stored Refund Via alone.
  var effectiveRefund = refundMethodForStatus(status) || r.refundMethod;
  var lines = [];
  lines.push("Dear "+recipient+",");
  lines.push("");
  if(isFinal){
    lines.push(isWhole
      ? "This order has been cancelled."
      : "The following item(s) on this order have been cancelled.");
  } else {
    lines.push("Please find below "+(isWhole
      ? "an order cancellation request."
      : "an item cancellation request for the order below."));
  }
  lines.push("");
  if(r.retain !== "Retained"){
    if(effectiveRefund === "Same Payment Method"){
      lines.push("Kindly process the refund to the same payment method used for this order.");
    } else if(effectiveRefund === "Credit Note"){
      lines.push("Kindly process this as a Credit Note.");
    } else if(effectiveRefund === "Cash on Delivery"){
      lines.push("Cash on Delivery - No Refund required (payment was not collected online).");
    }
    lines.push("");
  }
  lines.push("ORDER DETAILS");
  lines.push("-------------");
  lines.push("Web Order:   "+(r.webOrderNumber||"N/A"));
  lines.push("LN Order:    "+r.lnOrder);
  lines.push("Mobile:      "+r.mobile);
  if(r.customerCode) lines.push("Customer:    "+((r.customerName?r.customerName+" ":"")+"("+r.customerCode+")"));
  lines.push("Status:      "+(CLOSED_STATUSES.indexOf(status)>-1 ? STATUS[status].label : (status==="pending"||status==="new") ? "Pending for Review" : "Email sent to "+recipient));
  if(CLOSED_STATUSES.indexOf(status)>-1 && state.currentUser) lines.push("Cancelled By: "+state.currentUser.username);
  lines.push("Date:        "+fmtDate(r.createdAt));
  lines.push("Amount:      "+fmtMoney(r.amount));
  lines.push("Refund Via:  "+refundLabel(effectiveRefund));
  lines.push("Agent Name:  "+r.agent);
  lines.push("");
  if(!isWhole && r.items){
    lines.push("ITEM(S) TO CANCEL");
    lines.push("-----------------");
    var itemNum = 1;
    r.items.split("\n").forEach(function(line){
      line = line.trim();
      if(line) lines.push("Item "+(itemNum++)+": "+line);
    });
    lines.push("");
  }
  if(remark){ lines.push("Remark: "+remark); lines.push(""); }
  lines.push("Regards,");
  lines.push(state.currentUser.username);

  return { to: recipient, subject: subject, body: lines.join("\n") };
}
function buildMailto(r, status, remark){
  var p = buildEmailParts(r, status, remark);
  return "mailto:?subject="+encodeURIComponent(p.subject)+"&body="+encodeURIComponent(p.body);
}
function openStoreEmail(r, status, remark){
  try{
    var a = document.createElement("a");
    a.href = buildMailto(r, status, remark);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){}
}
// mailto: only works when the PC has a desktop mail app registered as the
// default handler — on a machine where it isn't, clicking "Email the Store"
// silently falls back to some generic browser page and nobody ever sees the
// drafted email at all. This copies the same To/Subject/Body as plain text
// so it can be pasted into Outlook Web, Gmail, or anything else by hand.
async function copyEmailText(r, status, remark){
  var p = buildEmailParts(r, status, remark);
  var text = "To: "+p.to+"\nSubject: "+p.subject+"\n\n"+p.body;
  try{
    await navigator.clipboard.writeText(text);
    toast("Email copied — paste it into Outlook/webmail.");
  }catch(e){
    toast("Couldn't copy automatically — select the email text and copy it manually.");
  }
}

function canAct(){ return state.currentUser && (state.currentUser.role==="operations" || state.currentUser.role==="admin"); }
// Stage changes (New -> Sent to Store -> Cancelled...), editing a request
// after the fact, and creating new accounts are restricted to this named
// list, not the whole Operations/Admin role — must match the backend's
// STAGE_UPDATERS exactly (hiding a button here is UX only; the real
// enforcement is server-side).
var STAGE_UPDATERS = ["shenoudah", "mahmouda", "mariam", "shadys"];
function canUpdateStage(){
  if(!state.currentUser) return false;
  if(STAGE_UPDATERS.indexOf(String(state.currentUser.username||"").toLowerCase())!==-1) return true;
  return state.currentUser.role==="admin" || state.currentUser.role==="operations";
}

function canCreateAccounts(){ return state.currentUser && ACCOUNT_CREATORS.indexOf(String(state.currentUser.username||"").toLowerCase())!==-1; }
function isAdmin(){ return state.currentUser && state.currentUser.role==="admin"; }
function scopedRequests(scope){
  var now=Date.now(), from=0, to=now+1;
  if(scope==="today") from = startOfDay(now);
  else if(scope==="month") from = startOfMonth(now);
  else if(scope==="custom"){
    from = state.dashRange.from ? new Date(state.dashRange.from+"T00:00:00").getTime() : 0;
    to = state.dashRange.to ? new Date(state.dashRange.to+"T23:59:59").getTime() : now+1;
  }
  var list = state.requests.filter(function(r){ return r.createdAt >= from && r.createdAt <= to; });
  var f = state.dashFilters;
  if(f.region) list = list.filter(function(r){ return r.region===f.region; });
  if(f.status) list = list.filter(function(r){ return (r.status==="pending"?"new":r.status)===f.status; });
  if(f.orderType) list = list.filter(function(r){ return r.orderType===f.orderType; });
  if(f.source) list = list.filter(function(r){ return r.source===f.source; });
  if(f.agent) list = list.filter(function(r){ return r.agent===f.agent; });
  if(f.reason) list = list.filter(function(r){ return r.reason===f.reason; });
  return list;
}
function agentNames(){
  var seen = {}, names = [];
  state.requests.forEach(function(r){ if(r.agent && !seen[r.agent]){ seen[r.agent]=true; names.push(r.agent); } });
  return names.sort();
}
// Matches a searched mobile number regardless of a leading 0, a leading
// country code (971/966/974/968, with or without a "00"/"+" prefix) —
// "0501234567", "501234567" and "971501234567" should all find the same row.
function digitsOnly(s){ return String(s||"").replace(/\D/g,""); }
function mobileCore(s){
  var d = digitsOnly(s).replace(/^00/, "");
  ["971","966","974","968"].some(function(c){ if(d.indexOf(c)===0){ d = d.slice(c.length); return true; } return false; });
  return d.replace(/^0+/, "");
}
function mobileMatches(stored, query){
  var sc = mobileCore(stored), qc = mobileCore(query);
  if(!qc) return false;
  return sc.indexOf(qc)!==-1 || qc.indexOf(sc)!==-1;
}
function filteredRequests(){
  var f = state.filters;
  return state.requests.slice().sort(function(a,b){ return b.createdAt - a.createdAt; }).filter(function(r){
    if(f.status && (r.status==="pending"?"new":r.status)!==f.status) return false;
    if(f.orderType && r.orderType!==f.orderType) return false;
    if(f.region && r.region!==f.region) return false;
    if(f.agent && r.agent!==f.agent) return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var hay=[r.id,r.webOrderNumber,r.lnOrder,r.mobile,r.note,r.agent,r.items,r.customerCode,r.customerName].join(" ").toLowerCase();
      var textMatch = hay.indexOf(q)!==-1;
      var phoneMatch = /\d/.test(f.q) ? mobileMatches(r.mobile, f.q) : false;
      if(!textMatch && !phoneMatch) return false;
    }
    return true;
  });
}
function countBy(list, fn){ var m={}; list.forEach(function(r){ var k=fn(r); m[k]=(m[k]||0)+1; }); return m; }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
// Shared by both the Excel and PowerPoint exports — always the FULL request
// list (not whatever the dashboard's own scope/filters currently show), since
// an exported report is meant to stand on its own.
function computeReportData(){
  var list = state.requests.slice();
  var byStatus = countBy(list, function(r){ return STATUS[r.status]?STATUS[r.status].label:r.status; });
  var byRegion = countBy(list, function(r){ return (REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label || r.region; });
  var byRegionAmt = {};
  list.forEach(function(r){ var k=(REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label||r.region; byRegionAmt[k]=(byRegionAmt[k]||0)+toAED(r.amount,r.region); });
  var byType = countBy(list, function(r){ return r.orderType; });
  var byRefund = countBy(list, function(r){ return refundLabel(r.refundMethod); });
  var bySource = countBy(list, function(r){ return r.source||"Unspecified"; });
  var byAgent = countBy(list, function(r){ return r.agent; });
  var byReason = countBy(list, function(r){ return r.reason; });
  var byDayCounts = {}, byDayAmt = {};
  list.forEach(function(r){
    var d = r.createdAt ? new Date(r.createdAt).toISOString().slice(0,10) : "Unknown";
    byDayCounts[d] = (byDayCounts[d]||0)+1;
    byDayAmt[d] = (byDayAmt[d]||0)+toAED(r.amount,r.region);
  });
  var closedList = list.filter(function(r){ return CLOSED_STATUSES.indexOf(r.status)>-1; });
  var cod = list.filter(function(r){ return r.refundMethod==="Cash on Delivery"; }).length;
  var kpi = {
    total: list.length,
    closed: closedList.length,
    open: list.length - closedList.length,
    totalAmt: list.reduce(function(s,r){ return s+toAED(r.amount,r.region); },0),
    closedAmt: closedList.reduce(function(s,r){ return s+toAED(r.amount,r.region); },0),
    cod: cod,
    online: list.filter(function(r){ return r.orderType==="Online"; }).length,
    store: list.filter(function(r){ return r.orderType==="Store"; }).length,
  };
  return { list:list, byStatus:byStatus, byRegion:byRegion, byRegionAmt:byRegionAmt, byType:byType,
    byRefund:byRefund, bySource:bySource, byAgent:byAgent, byReason:byReason,
    byDayCounts:byDayCounts, byDayAmt:byDayAmt, kpi:kpi };
}

        '<div class="field" id="webOrderField"><label>Web Order Number <span id="webOrderReq">*</span></label><input type="text" id="webOrderNumberInput" name="webOrderNumber" maxlength="9" placeholder="9 letters/digits, e.g. WU1234567"><button type="button" class="linkbtn" data-etm="web" data-etm-src="webOrderNumberInput" style="padding:2px 0">Open in ETM ↗</button></div>'+
      '</div>'+

          SOURCES.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join("")+
        '</select></div>'+
        '<div class="field"><label>Cancel Order or Item *</label><select name="scope" id="scopeSel"><option value="">Select…</option>'+

        '</select></div>'+
      '</div>'+
      '<div class="field" id="itemsField" hidden style="margin-bottom:14px"></div>'+
      '<div class="field" style="margin-bottom:14px"><label>Agent Name</label><input type="text" value="'+esc(state.currentUser.username)+'" disabled></div>'+
      '<div class="field" style="margin-bottom:14px"><label>Customer</label><input type="text" id="customerDisplay" placeholder="Filled automatically from the ETM paste" disabled>'+
        '<input type="hidden" id="customerCodeInput"><input type="hidden" id="customerNameInput"></div>'+
      '<div class="field" style="margin-bottom:14px"><label>Order Segment</label><input type="text" id="orderSegmentInput" placeholder="ETM delivery/fulfillment code (e.g. DFX, CDF) — filled from the paste" disabled></div>'+
      '<div class="field" style="margin-bottom:14px"><label>Note *</label><textarea id="noteInput" name="note" placeholder="Explain the cancellation in your own words…"></textarea></div>'+
      '<div class="grid cols2" style="margin-bottom:14px">'+
        '<div class="field"><label>Amount Status — Refund Via *</label><select id="refundMethodSel" name="refundMethod"><option value="">Select…</option>'+
          REFUND_METHODS.map(function(m){ return '<option value="'+esc(m)+'">'+esc(refundLabel(m))+'</option>'; }).join("")+
        '</select></div>'+
        '<div class="field"><label>Retain / Not Retain *</label><select id="retainSel" name="retain"><option value="">Select…</option>'+
          RETAIN_OPTIONS.map(function(m){ return '<option value="'+esc(m)+'">'+esc(m)+'</option>'; }).join("")+
        '</select></div>'+
      '</div>'+
      '<div class="btnrow"><button class="btn primary" type="submit">Submit request</button></div>'+
    '</form></div>'+
  '<div class="card etm-panel">'+
    '<h2 style="font-size:14.5px">Paste from ETM</h2>'+
    '<p class="sub">ETM\'s own server refuses to load inside another page — it rejects any embedded/cross-origin view with "Bad Request #400". Open the order in ETM, select its details and copy, then paste them below — the fields on the left fill in automatically.</p>'+
    '<div class="btnrow" style="flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px">'+
      '<button type="button" class="btn" data-etm="web" style="justify-content:center">Open ETM — Web Order Search ↗</button>'+
      '<button type="button" class="btn" data-etm="ln" style="justify-content:center">Open ETM — LN Order Search ↗</button>'+
    '</div>'+
    '<label>Paste the order details here</label>'+
    '<textarea id="etmPasteBox" placeholder="Paste the copied ETM order details here…" style="width:100%;height:64px;font-family:ui-monospace,Consolas,monospace;font-size:11px"></textarea>'+
    '<button type="button" class="btn primary" id="etmParseBtn" style="width:100%;justify-content:center;margin-top:8px">⚡ Auto-fill from paste</button>'+
    '<p id="etmParseHint" style="margin-top:8px;font-size:11.5px;color:var(--ink-faint);min-height:14px"></p>'+
  '</div>'+
  '</div>';
}
function wireNewRequest(){
  var sel = $("#orderTypeSel");
  function syncWebOrder(){
    var isOnline = sel.value==="Online";
    $("#webOrderReq").textContent = isOnline ? "*" : "(not applicable for Store)";
    var field = $("#webOrderField");
    var input = field.querySelector("input");
    field.classList.toggle("na", !isOnline);
    if(!isOnline) input.value="";
  }
  sel.addEventListener("change", syncWebOrder);
  syncWebOrder();

  function branchName(entry){ return entry.branch+" — "+((REGIONS.filter(function(x){return x.code===entry.region;})[0]||{}).label||entry.region); }
  var regionSel = $("#regionSel");
  function syncCurrency(){ $("#amountCurrency").textContent = regionSel.value ? currencyFor(regionSel.value) : "select region"; }
  regionSel.addEventListener("change", syncCurrency);
  syncCurrency();
  // Narrows the Refund Via choices to what's actually possible once ETM says
  // whether the order was paid: Cash on Delivery for an unpaid order (locked
  // in, nothing else makes sense), or just the two real refund routes for a
  // paid one — removes the chance of picking a refund method that
  // contradicts what was actually collected.
  function syncRefundOptions(paid){
    var sel2 = $("#refundMethodSel");
    var methods = paid===0 ? ["Cash on Delivery"] : (paid>0 ? ["Same Payment Method","Credit Note"] : REFUND_METHODS);
    sel2.innerHTML = '<option value="">Select…</option>'+methods.map(function(m){ return '<option value="'+esc(m)+'">'+esc(refundLabel(m))+'</option>'; }).join("");
    if(methods.length===1) sel2.value = methods[0];
  }
  function detectFromOrderNo(){
    var lnVal = (form.lnOrder.value||"").trim().toUpperCase();
    var webVal = (form.webOrderNumber.value||"").trim().toUpperCase();
    var prefix = (lnVal.length>=2 ? lnVal.slice(0,2) : (webVal.length>=2 ? webVal.slice(0,2) : ""));
    var hint = $("#regionHint"), regionEl = $("#regionSel");
    var matches = PREFIX_MAP[prefix];
    if(matches){
      if(matches.length===1){
        regionEl.value = matches[0].region;
        sel.value = matches[0].type; syncWebOrder();
        hint.textContent = "Detected: "+branchName(matches[0]);
        syncCurrency();
      } else {
        hint.textContent = "Prefix matches more than one branch — confirm the region: "+matches.map(branchName).join(" / ");
      }
      return;
    }
    // Branch prefix not in our list — fall back to the general rule: an order
    // number starting with "W" is always Online, anything else is Store. Region
    // still needs picking manually since we don't know which branch this is.
    if(prefix){
      sel.value = (prefix.charAt(0)==="W") ? "Online" : "Store";
      syncWebOrder();
      hint.textContent = "Detected: "+sel.value+" order (branch not in our list — confirm the region manually)";
    } else {
      hint.textContent = "";
    }
  }
  var lastRejectedToast = "";
  function checkDuplicateOrderNo(){
    var lnVal = (form.lnOrder.value||"").trim().toUpperCase();
    var webVal = (form.webOrderNumber.value||"").trim().toUpperCase();
    var hint = $("#dupHint");
    var dup = (lnVal||webVal) ? findDuplicateRequest(lnVal, webVal) : null;
    if(dup){
      hint.textContent = "⚠ Already has a cancellation request: "+dup.id+" ("+(STATUS[dup.status]?STATUS[dup.status].label:dup.status)+")";
      hint.classList.add("warn");
      return;
    }
    hint.classList.remove("warn");
    var rej = (lnVal||webVal) ? findRejectedMatch(lnVal, webVal) : null;
    if(rej){
      hint.textContent = "ℹ A previous request for this order ("+rej.id+") was rejected — you can still submit a new one.";
      var key = lnVal+"|"+webVal;
      if(lastRejectedToast!==key){ lastRejectedToast = key; toast("Note: a previous request for this order was rejected ("+rej.id+"). You can still submit."); }
    } else {
      hint.textContent = "";
      lastRejectedToast = "";
    }
  }

  var form = $("#newReqForm");
  form.lnOrder.addEventListener("input", function(){ detectFromOrderNo(); checkDuplicateOrderNo(); });
  form.webOrderNumber.addEventListener("input", function(){ detectFromOrderNo(); checkDuplicateOrderNo(); });

  var etmParsed = null;          // last parsed ETM paste: {lnOrder,webOrderNumber,mobile,total,paid,items[]}
  var itemSelections = [];       // [{code,desc,unitPrice,orderedQty,cancelQty,checked}]
  var extraCharges = [];         // [{desc,amount}] — e.g. a delivery fee the agent adds manually

  function lineAmount(it){ return it.checked ? (it.cancelQty*it.unitPrice) : 0; }
  function grandItemsTotal(){
    var t = itemSelections.reduce(function(s,it){ return s+lineAmount(it); }, 0);
    t += extraCharges.reduce(function(s,c){ return s+(Number(c.amount)||0); }, 0);
    return t;
  }
  function syncItemsTotals(rebuild){
    if(rebuild){ buildItemPicker(); return; }
    itemSelections.forEach(function(it,i){
      var cell = document.querySelector('[data-rowkey="i'+i+'"] .itm-line-total');
      if(cell) cell.textContent = lineAmount(it).toFixed(2);
    });
    extraCharges.forEach(function(c,i){
      var cell = document.querySelector('[data-rowkey="x'+i+'"] .itm-line-total');
      if(cell) cell.textContent = Number(c.amount||0).toFixed(2);
    });
    var gt = $("#itmGrandTotal"); if(gt) gt.textContent = grandItemsTotal().toFixed(2);
    var amt = $("#amountInput"); if(amt) amt.value = grandItemsTotal().toFixed(2);
    var txt = itemSelections.filter(function(it){ return it.checked && it.cancelQty>0; })
      .map(function(it){ return it.desc+" ("+it.code+") — cancel "+it.cancelQty+" of "+it.orderedQty+" @ "+it.unitPrice.toFixed(2)+" = "+lineAmount(it).toFixed(2); })
      .concat(extraCharges.filter(function(c){ return c.desc && Number(c.amount); }).map(function(c){ return c.desc+" = "+Number(c.amount).toFixed(2); }))
      .join("\n");
    var ti = $("#itemsInput"); if(ti) ti.value = txt;
  }
  function buildItemPicker(){
    var field = $("#itemsField");
    if(!itemSelections.length){
      field.innerHTML = '<label>Items to Cancel *</label><textarea id="itemsInput" name="items" placeholder="List the specific item(s) being cancelled… (paste the ETM order details on the right to get a checklist instead)"></textarea>';
      return;
    }
    // Same column order ETM itself shows (Line/Item/Description/WH/Ordered/
    // Delivered/BO/Price/Total), plus our own Cancel Qty + computed Amount.
    var rows = itemSelections.map(function(it,i){
      return '<tr data-rowkey="i'+i+'">'+
        '<td><input type="checkbox" data-isel="'+i+'" '+(it.checked?"checked":"")+'></td>'+
        '<td style="text-align:center">'+esc(it.line||"")+'</td>'+
        '<td style="text-align:center">'+esc(it.code)+'</td>'+
        '<td style="text-align:right">'+esc(it.desc)+'</td>'+
        '<td style="text-align:center">'+esc(it.wh||"")+'</td>'+
        '<td style="text-align:center">'+it.orderedQty+'</td>'+
        '<td style="text-align:center">'+esc(it.delivered||"0")+'</td>'+
        '<td style="text-align:center">'+esc(it.bo||"0")+'</td>'+
        '<td style="text-align:center">'+(it.price||it.unitPrice).toFixed(2)+'</td>'+
        '<td style="text-align:center">'+(it.lineTotal!=null?it.lineTotal.toFixed(2):(it.orderedQty*it.unitPrice).toFixed(2))+'</td>'+
        '<td style="text-align:center"><input type="number" min="0" max="'+it.orderedQty+'" step="1" data-iqty="'+i+'" value="'+it.cancelQty+'" style="width:52px;padding:4px" '+(it.checked?"":"disabled")+'></td>'+
        '<td class="itm-line-total" style="text-align:center">'+lineAmount(it).toFixed(2)+'</td>'+
      '</tr>';
    }).join("");
    var extras = extraCharges.map(function(c,i){
      return '<tr data-rowkey="x'+i+'">'+
        '<td></td>'+
        '<td colspan="8"><input type="text" data-exdesc="'+i+'" value="'+esc(c.desc)+'" placeholder="e.g. Delivery fee" style="width:100%;padding:4px"></td>'+
        '<td></td>'+
        '<td></td>'+
        '<td style="text-align:center"><input type="number" step="0.01" data-examt="'+i+'" value="'+(c.amount||"")+'" style="width:70px;padding:4px"></td>'+
      '</tr>';
    }).join("");
    field.innerHTML =
      '<label>Items to Cancel *</label>'+
      '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px;min-width:760px">'+
        '<tr><th></th><th>Line</th><th>Item</th><th style="text-align:right">Description</th><th>WH</th><th>Ordered</th><th>Delivered</th><th>BO</th><th>Price</th><th>Total</th><th>Cancel qty</th><th>Amount</th></tr>'+
        rows + extras +
        '<tr><td colspan="12" style="padding-top:6px"><button type="button" class="linkbtn" id="addExtraChargeBtn">+ Add other charge/item</button></td></tr>'+
        '<tr><td colspan="10"></td><td style="font-weight:700;text-align:center">Total</td><td id="itmGrandTotal" style="font-weight:700;text-align:center">0.00</td></tr>'+
      '</table></div>'+
      '<style>#itemsField th{font-size:10px;color:var(--ink-faint);text-align:center;padding:4px;white-space:nowrap}#itemsField td{border-top:1px solid var(--border);padding:5px 4px;white-space:nowrap}</style>'+
      '<textarea id="itemsInput" name="items" hidden></textarea>';
    syncItemsTotals();
  }
  $("#itemsField").addEventListener("change", function(e){
    var t = e.target;
    if(t.dataset.isel!==undefined){
      var i = +t.dataset.isel;
      itemSelections[i].checked = t.checked;
      if(t.checked && !itemSelections[i].cancelQty) itemSelections[i].cancelQty = itemSelections[i].orderedQty;
      buildItemPicker();
    } else if(t.dataset.iqty!==undefined){
      var j = +t.dataset.iqty;
      itemSelections[j].cancelQty = Math.max(0, Math.min(itemSelections[j].orderedQty, parseFloat(t.value)||0));
      syncItemsTotals();
    } else if(t.dataset.exdesc!==undefined){
      extraCharges[+t.dataset.exdesc].desc = t.value; syncItemsTotals();
    } else if(t.dataset.examt!==undefined){
      extraCharges[+t.dataset.examt].amount = parseFloat(t.value)||0; syncItemsTotals();
    }
  });
  $("#itemsField").addEventListener("input", function(e){
    if(e.target.dataset.iqty!==undefined || e.target.dataset.examt!==undefined || e.target.dataset.exdesc!==undefined){
      // live update while typing, without rebuilding the table (would steal focus)
      var t = e.target;
      if(t.dataset.iqty!==undefined){ itemSelections[+t.dataset.iqty].cancelQty = Math.max(0, Math.min(itemSelections[+t.dataset.iqty].orderedQty, parseFloat(t.value)||0)); }
      if(t.dataset.examt!==undefined){ extraCharges[+t.dataset.examt].amount = parseFloat(t.value)||0; }
      if(t.dataset.exdesc!==undefined){ extraCharges[+t.dataset.exdesc].desc = t.value; }
      syncItemsTotals();
    }
  });
  $("#itemsField").addEventListener("click", function(e){
    if(e.target.id==="addExtraChargeBtn"){ extraCharges.push({desc:"",amount:0}); buildItemPicker(); }
  });

  var scopeSel = $("#scopeSel");
  function syncScope(){
    var isItem = scopeSel.value==="Specific Item(s)";
    var field = $("#itemsField");
    field.hidden = !isItem;
    if(isItem){
      buildItemPicker();
    } else {
      field.innerHTML = "";
      if(etmParsed && etmParsed.total!=null) $("#amountInput").value = etmParsed.total;
    }
  }
  scopeSel.addEventListener("change", syncScope);
  syncScope();

  var etmParseBtn = $("#etmParseBtn");
  if(etmParseBtn) etmParseBtn.addEventListener("click", function(){
    var raw = $("#etmPasteBox").value;
    var hint = $("#etmParseHint");
    if(!raw.trim()){ hint.textContent = "Paste the ETM order details first."; return; }
    var parsed = parseEtmPaste(raw);
    if(!parsed.lnOrder && !parsed.mobile && !parsed.items.length){
      hint.textContent = "Couldn't recognize this text — select and copy the whole order-details block from ETM (including Mobile / Total / the items table), then paste it here.";
      return;
    }
    etmParsed = parsed;
    if(parsed.lnOrder) form.lnOrder.value = parsed.lnOrder;
    if(parsed.webOrderNumber){ form.webOrderNumber.value = parsed.webOrderNumber; sel.value = "Online"; syncWebOrder(); }
    detectFromOrderNo(); checkDuplicateOrderNo();
    if(parsed.mobile) $("#mobileInput").value = parsed.mobile;
    syncRefundOptions(parsed.paid);
    if(parsed.customerCode){
      $("#customerCodeInput").value = parsed.customerCode;
      $("#customerNameInput").value = parsed.customerName;
      $("#customerDisplay").value = (parsed.customerName?parsed.customerName+" ":"")+"("+parsed.customerCode+")";
    }
    if(parsed.orderSegment) $("#orderSegmentInput").value = parsed.orderSegment;
    itemSelections = parsed.items.map(function(it){ return {
      line:it.line, code:it.code, desc:it.desc, wh:it.wh, delivered:it.delivered, bo:it.bo, price:it.price, lineTotal:it.lineTotal,
      unitPrice:it.unitPrice, orderedQty:it.qty, cancelQty:it.qty, checked:false
    }; });
    extraCharges = [];
    if(scopeSel.value==="Whole Order" && parsed.total!=null) $("#amountInput").value = parsed.total;
    if(scopeSel.value==="Specific Item(s)") buildItemPicker();
    hint.textContent = "✓ Filled from ETM — check the fields, then submit.";
    toast("Auto-filled from the pasted ETM data.");
  });

  var dateEl = $("#dateInput");
  if(dateEl) dateEl.value = new Date().toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short",year:"numeric"});

  /* Optional CTI/CCS screen-pop integration: if your call center system can open this
     page with the caller's number (and region) as URL parameters — e.g.
     https://.../?mobile=0501234567&region=UAE — those fields are pre-filled automatically. */
  try{
    var qp = new URLSearchParams(location.search);
    var mobileEl = $("#mobileInput"), regionEl = $("#regionSel");
    if(qp.get("mobile") && mobileEl) mobileEl.value = qp.get("mobile");
    if(qp.get("region") && regionEl){ regionEl.value = qp.get("region").toUpperCase(); syncCurrency(); }
  }catch(e){}

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var ok = await submitRequest();
    if(ok){
      form.reset(); syncWebOrder(); syncCurrency(); clearInvalidFields(); checkDuplicateOrderNo(); $("#regionHint").textContent="";
      etmParsed = null; itemSelections = []; extraCharges = [];
      var pasteBox = $("#etmPasteBox"); if(pasteBox) pasteBox.value = "";
      var hint2 = $("#etmParseHint"); if(hint2) hint2.textContent = "";
      syncScope(); syncRefundOptions(null);
    }
  });
  // Clear the red highlight on a field the moment the agent starts fixing it.
  form.addEventListener("input", function(e){ markField(e.target, false); });
  form.addEventListener("change", function(e){ markField(e.target, false); });
}

/* ---------- REQUESTS LIST ---------- */
function statusBadge(s){ var d=STATUS[s]||STATUS.pending; return '<span class="badge '+d.cls+'"><span class="dot"></span>'+d.label+'</span>'; }
function typeBadge(t){ return '<span class="badge '+(t==="Online"?"online":"store")+'">'+esc(t)+'</span>'; }
function retainBadge(r){ return '<span class="badge '+(r==="Retained"?"retained":"notretained")+'">'+esc(r)+'</span>'; }

function renderRequests(){
  var list = filteredRequests();
  var rows = list.length ? list.map(renderReqCard).join("") : (
    '<div class="empty"><div class="big">🗂️</div><h3 style="margin:0 0 6px">No requests match these filters</h3>'+
    '<p class="sub" style="margin:0">'+(state.requests.length? "Try clearing a filter." : "Once agents submit cancellation requests, they will appear here.")+'</p></div>'
  );
  return '<div class="card">'+
    '<div class="filterbar" style="margin-bottom:16px">'+
      '<div class="field grow"><label>Search</label><input type="text" id="fQ" placeholder="ID, order number, mobile number, customer, note, agent…" value="'+esc(state.filters.q)+'"></div>'+
      '<div class="field"><label>Status</label><select id="fStatus"><option value="">All</option>'+
        Object.keys(STATUS).filter(function(k){return k!=="pending";}).map(function(k){ return '<option value="'+k+'" '+(state.filters.status===k?"selected":"")+'>'+STATUS[k].label+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label>Order Type</label><select id="fType"><option value="">All</option><option '+(state.filters.orderType==="Store"?"selected":"")+'>Store</option><option '+(state.filters.orderType==="Online"?"selected":"")+'>Online</option></select></div>'+
      '<div class="field"><label>Region</label><select id="fRegion"><option value="">All</option>'+
        REGIONS.map(function(r){ return '<option value="'+r.code+'" '+(state.filters.region===r.code?"selected":"")+'>'+r.code+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label>Agent</label><select id="fAgent"><option value="">All</option>'+
        agentNames().map(function(a){ return '<option value="'+esc(a)+'" '+(state.filters.agent===a?"selected":"")+'>'+esc(a)+'</option>'; }).join("")+'</select></div>'+
      '<button class="btn sm" id="exportBtn">Export CSV</button>'+
    '</div>'+
    '<div class="reqlist">'+rows+'</div>'+
    '</div>';
}
var STAGE_DEFS = [
  { statuses:["new","pending"], label:"Submitted" },
  { statuses:["approved","sent","sent_online"], label:"Sent to Store / Online Team" },
  // sent_store_refund/sent_store_credit are terminal for Store orders (sending
  // IS closing it), so they belong in the final bucket alongside the three
  // Cancelled outcomes, not the middle "in progress" one.
  { statuses:["cancelled_refund","cancelled_credit","cancelled_cdf","sent_store_refund","sent_store_credit"], label:"Cancelled" }
];
function stageIndexFor(status){
  for(var i=0;i<STAGE_DEFS.length;i++){ if(STAGE_DEFS[i].statuses.indexOf(status)!==-1) return i; }
  return 0;
}
function lastHistFor(r, statuses){
  var matches = (r.history||[]).filter(function(h){ return statuses.indexOf(h.status)!==-1; });
  return matches.length ? matches[matches.length-1] : null;
}
function renderStepper(r){
  if(r.status==="rejected" || r.status==="not_cancelled"){
    var hist2 = lastHistFor(r, [r.status]);
    var meta2 = hist2 ? fmtDate(hist2.at)+(hist2.by?" · "+esc(hist2.by):"") : "";
    return '<div class="stepper">'+
      '<div class="step done"><div class="step-dot">✓</div><div class="step-info"><div class="step-label">Submitted</div></div></div>'+
      '<div class="step-line" style="background:var(--bad)"></div>'+
      '<div class="step current"><div class="step-dot" style="border-color:var(--bad);color:var(--bad)">✕</div><div class="step-info"><div class="step-label" style="color:var(--bad)">'+esc(STATUS[r.status].label)+'</div><div class="step-meta">'+esc(meta2)+'</div></div></div>'+
    '</div>';
  }
  var curIdx = stageIndexFor(r.status);
  var isLastStage = curIdx === STAGE_DEFS.length-1;
  return '<div class="stepper">'+STAGE_DEFS.map(function(s,i){
    // The final stage has nothing after it to still be "in progress" toward,
    // so once reached it's done (✓), not perpetually "current".
    var cls = (i<curIdx || (i===curIdx && isLastStage)) ? "done" : (i===curIdx ? "current" : "upcoming");
    var hist = lastHistFor(r, s.statuses);
    var label = (i===curIdx && STATUS[r.status]) ? STATUS[r.status].label : s.label;
    var meta = hist ? fmtDate(hist.at)+(hist.by?" · "+esc(hist.by):"") : (cls==="upcoming" ? "Pending" : "");
    var connector = i>0 ? '<div class="step-line '+(i<=curIdx?"done":"")+'"></div>' : "";
    return connector+'<div class="step '+cls+'"><div class="step-dot">'+(cls==="done"?"✓":(i+1))+'</div><div class="step-info"><div class="step-label">'+esc(label)+'</div><div class="step-meta">'+esc(meta)+'</div></div></div>';
  }).join("")+'</div>';
}

function exportCsv(){
  var list = filteredRequests();
  var cols = ["id","createdAt","agent","orderType","webOrderNumber","lnOrder","mobile","customerCode","customerName","region","amount","currency","amountAED","reason","source","scope","items","note","refundMethod","retain","status"];
  var head = cols.join(",");
  var rows = list.map(function(r){
    return cols.map(function(c){
      var v;
      if(c==="createdAt") v = fmtDate(r.createdAt);
      else if(c==="status") v = (STATUS[r.status]?STATUS[r.status].label:r.status);
      else if(c==="currency") v = currencyFor(r.region);
      else if(c==="amountAED") v = toAED(r.amount, r.region).toFixed(2);
      else v = (r[c]==null?"":r[c]);
      v = String(v).replace(/"/g,'""');
      return '"'+v+'"';
    }).join(",");
  });
  var csv = head+"\n"+rows.join("\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "pan-home-cancellations.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ---------- full report exports (Excel workbook + PowerPoint deck) ----------
   Both always cover ALL requests, not just whatever the dashboard's own
   scope/filters currently show — a downloaded report is meant to stand on
   its own. Built entirely client-side (xlsx.js / pptxgenjs, loaded from a
   CDN in <head>) since this is a static site with no server to render them. */
function sortedPairs(m){ return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; }); }

function exportXlsxReport(){
  if(typeof XLSX==="undefined"){ toast("Excel library didn't load — check your connection and try again."); return; }
  var d = computeReportData();
  var wb = XLSX.utils.book_new();

  var summary = [
    ["Pan Home Cancel Desk — Cancellation Requests Analysis"],
    ["Generated: "+new Date().toLocaleString()],
    [],
    ["Metric","Value"],
    ["Total Requests", d.kpi.total],
    ["Closed / Cancelled", d.kpi.closed],
    ["Still Open", d.kpi.open],
    ["Total Value (AED)", round2(d.kpi.totalAmt)],
    ["Closed Value (AED)", round2(d.kpi.closedAmt)],
    ["Cash on Delivery (COD) Requests", d.kpi.cod],
    ["Online Requests", d.kpi.online],
    ["Store Requests", d.kpi.store],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "Summary");

  var rawCols = ["id","createdAt","agent","orderType","webOrderNumber","lnOrder","mobile","region","currency",
    "amount","amountAED","reason","note","refundMethod","retain","status","statusLabel","source","scope","items",
    "customerCode","customerName","orderSegment"];
  var rawRows = [rawCols].concat(d.list.map(function(r){
    return rawCols.map(function(c){
      if(c==="createdAt") return fmtDate(r.createdAt);
      if(c==="currency") return currencyFor(r.region);
      if(c==="amountAED") return round2(toAED(r.amount, r.region));
      if(c==="statusLabel") return STATUS[r.status] ? STATUS[r.status].label : r.status;
      return r[c]==null ? "" : r[c];
    });
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rawRows), "Raw Data");

  function pairsSheet(name, counts, amounts){
    var header = ["Category","Requests"].concat(amounts ? ["Value (AED)"] : []);
    var rows = [header].concat(sortedPairs(counts).map(function(k){
      var row = [k, counts[k]];
      if(amounts) row.push(round2(amounts[k]||0));
      return row;
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), name.slice(0,31));
  }
  pairsSheet("By Status", d.byStatus);
  pairsSheet("By Region", d.byRegion, d.byRegionAmt);
  pairsSheet("By Order Type", d.byType);
  pairsSheet("By Refund Method (incl COD)", d.byRefund);
  pairsSheet("By Source", d.bySource);
  pairsSheet("By Agent", d.byAgent);
  pairsSheet("Top Reasons", d.byReason);
  pairsSheet("By Day", d.byDayCounts, d.byDayAmt);

  XLSX.writeFile(wb, "PanHome_Cancellations_Analysis.xlsx");
  toast("Excel report downloaded — "+d.kpi.total+" requests.");
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  var scope = state.dashScope;
  var list = scopedRequests(scope);
  var total = list.length;

  var closedList = list.filter(function(r){ return CLOSED_STATUSES.indexOf(r.status)>-1; });
  // Rejected requests count toward neither Pending nor Cancelled value — they
  // aren't actively being worked (the agent resubmits separately as a new request).
  var openList = list.filter(function(r){ return CLOSED_STATUSES.indexOf(r.status)===-1 && REJECTED_STATUSES.indexOf(r.status)===-1 && NOT_CANCELLED_STATUSES.indexOf(r.status)===-1; });
  var cancelledAmt = closedList.reduce(function(s,r){ return s+toAED(r.amount, r.region); },0);
  var pendingAmt = openList.reduce(function(s,r){ return s+toAED(r.amount, r.region); },0);
  var retained = list.filter(function(r){ return r.retain==="Retained"; }).length;
  var retRate = total? Math.round(retained/total*100) : 0;
  var closedRate = total? Math.round(closedList.length/total*100) : 0;

  var byReason = countBy(list, function(r){ return r.reason; });
  var byRegion = countBy(list, function(r){ return (REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label || r.region; });
  var byRegionAmt = {};
  list.forEach(function(r){ var k=(REGIONS.filter(function(x){return x.code===r.region;})[0]||{}).label||r.region; byRegionAmt[k]=(byRegionAmt[k]||0)+toAED(r.amount, r.region); });
  var byCustomer = {};
  list.forEach(function(r){
    if(!r.customerCode) return;

  var byCustomerCount = {}, byCustomerAmt = {};
